<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苗博</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--text:#3a3530;--light:#8a8075;--accent:#d4a574;--warm:#e8c4a0;--hl:#f5e6d3;--border:#ebe4db;--shadow:0 2px 12px rgba(180,140,100,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:16px}
a{color:var(--accent);text-decoration:none}
header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;cursor:pointer}
header img{width:40px;height:40px;border-radius:50%;object-fit:cover}
header .title{font-size:20px;font-weight:600}
header .sub{font-size:12px;color:var(--light)}
header .right{margin-left:auto;font-size:14px}
main{max-width:680px;margin:0 auto;padding:20px 16px 100px}
.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sort-bar button,.filter-btn{background:none;border:1px solid var(--border);border-radius:16px;padding:4px 12px;color:var(--light);cursor:pointer;font-size:13px}
.sort-bar button.active{background:var(--warm);color:var(--text);border-color:var(--accent)}
.filter-panel{background:var(--card);border-radius:12px;padding:12px;margin-bottom:16px;box-shadow:var(--shadow);display:none}
.filter-panel.show{display:block}
.filter-panel .year{font-weight:600;margin:8px 0 4px;cursor:pointer}
.filter-panel .months{display:flex;flex-wrap:wrap;gap:6px}
.filter-panel .months span{background:var(--bg);border-radius:12px;padding:2px 10px;font-size:12px;cursor:pointer}
.filter-panel .months span.active{background:var(--warm)}
.card{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer}
.card .date{font-size:12px;color:var(--light);margin-bottom:6px}
.card h2{font-size:18px;margin-bottom:6px}
.excerpt{font-size:14px;color:#666;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.content{background:var(--card);border-radius:12px;padding:24px 20px;box-shadow:var(--shadow);margin-bottom:24px}
.content p{margin-bottom:16px}
.content img{max-width:100%;border-radius:8px;margin:12px 0}
.highlight{background:var(--hl);border-bottom:2px solid var(--accent);cursor:pointer;border-radius:2px;padding:0 2px}
.comment{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.comment .floor{font-size:12px;color:var(--light)}
.comment .user{font-weight:600;font-size:14px}
.comment .time{font-size:12px;color:var(--light);margin-left:8px}
.comment .text{margin:8px 0}
.comment .actions{font-size:13px;color:var(--light)}
.comment .actions span{cursor:pointer;margin-right:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;padding:20px;z-index:201;transform:translateY(100%);transition:.25s}
.sheet.show{transform:translateY(0)}
.sheet textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;height:80px;font-family:inherit}
.sheet .btns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.sheet button{padding:8px 16px;border-radius:20px;border:none;cursor:pointer}
.sheet .cancel{background:var(--border)}
.sheet .ok{background:var(--accent);color:#fff}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border-radius:16px;padding:28px 24px;max-width:320px;text-align:center}
.modal button{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:10px 28px;cursor:pointer;margin-top:12px}
.box{background:var(--card);border-radius:12px;padding:28px 24px;max-width:360px;margin:40px auto;box-shadow:var(--shadow)}
.box input,.box textarea{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit}
.box button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer}
footer{text-align:center;padding:24px 16px 40px;font-size:12px;color:var(--light)}
footer .dis{max-width:640px;margin:12px auto 0;padding:12px 16px;background:rgba(255,255,255,.6);border-radius:8px;border:1px solid var(--border);line-height:1.7}
</style>
</head>
<body>
<header onclick="showList()">
  <img src="logo.png" alt="logo">
  <div><div class="title">苗博</div><div class="sub">演员谢苗超话</div></div>
  <div class="right" id="auth" onclick="event.stopPropagation()"></div>
</header>
<main id="main"><p style="text-align:center;padding:40px;color:var(--light)">加载中...</p></main>
<footer>
  <div>制作：Kokoro | 林科森</div>
  <div class="dis">◆ 本站为谢苗粉丝向博客考古站，非官方、非商业、不盈利。文章内容由粉丝整理分享，著作权归谢苗所有。请勿发布无关或引起不适的内容，自觉遵守网络规范。用户需对自身发言负责，本站有权删除不当内容。如有侵权或不妥，请联系我们删除。感谢配合。 ◆</div>
</footer>

<div class="modal-overlay" id="initModal">
  <div class="modal">
    <h3>苗博</h3>
    <p>一次穿越时空的聚会<br>谢苗早年博客考古站<br><br>制作：Kokoro | 林科森<br><br>本站为粉丝向，非官方、不盈利，著作权归谢苗。</p>
    <button onclick="document.getElementById('initModal').style.display='none';localStorage.setItem('miaobo_seen','1');showList()">开始阅读</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <textarea id="hlInput" placeholder="写下评论..."></textarea>
  <div class="btns">
    <button class="cancel" onclick="closeSheet()">取消</button>
    <button class="ok" onclick="makeExcerpt()" style="background:#c4a484">生成书摘</button>
    <button class="ok" onclick="addHighlight()">画线并评论</button>
  </div>
</div>

<script>
const ADMINS = ['Kokoro','林科森'];
let posts = JSON.parse(localStorage.getItem('mb_posts')||'null') || [{
  id:1, title:"一次穿越时空的聚会！！！", date:"2009-01-14 18:27",
  excerpt:"11号在光线传媒举行了新老少林寺主创的联欢会~~ 两代“少林弟子”齐聚一堂，气氛其乐融融！",
  content:`<p>11号在光线传媒举行了新老少林寺主创的联欢会~~ 两代“少林弟子”齐聚一堂，气氛其乐融融！</p><p>对于电影《少林寺》我想没有人会感到陌生，那是中国电影的一个神话，也是功夫电影的一个标志。作为老电影《少林寺》的代表，演员计春华、于海、于承惠。导演张鑫炎以及主题曲《少林少林》的作曲家王立平老师等前辈悉数到场。</p><p>我感到这次机会的难得，更加体会到这次机会的珍贵！所以我们也尽自己的努力献上各式各样的节目~~ 值得一提的是我和李渊的“舞蹈”，颇费了我们一番心血... 迈克的舞蹈融合了中国的武术，我想这是我们这台节目的看点之一！</p><p>如果不是这次机缘，我想很难有机会能和这么多“少林”前辈们同台交流，兴奋之情无以言表！</p><p>看着与前辈们的一张张合影，给了我更多的信念与鼓励！感谢少林，让我们新老主创一同在神圣的舞台上体会百味人生；感谢前辈，让新一代的我们有了为之奋斗的动力；感谢观众，让掌声源源不断的作为我们身后支撑的无穷力量！让我们真诚祝愿：祝愿“少林之路”更加流光溢彩，更加璀璨辉煌！</p>`
}];
let comments = JSON.parse(localStorage.getItem('mb_comments')||'[]');
let highlights = JSON.parse(localStorage.getItem('mb_highlights')||'[]');
let user = localStorage.getItem('mb_user')||null;
let sort = 'newest';
let filter = null;
let selText = '';
let curId = null;

function save(){
  localStorage.setItem('mb_posts', JSON.stringify(posts));
  localStorage.setItem('mb_comments', JSON.stringify(comments));
  localStorage.setItem('mb_highlights', JSON.stringify(highlights));
}
function isAdmin(){return user && ADMINS.includes(user)}

function showList(){
  let list = posts;
  if(filter){
    list = posts.filter(p=>{
      const d=new Date(p.date);
      if(d.getFullYear()!==filter.y) return false;
      if(filter.m && d.getMonth()+1!==filter.m) return false;
      return true;
    });
  }
  list = [...list].sort((a,b)=> sort==='oldest' ? new Date(a.date)-new Date(b.date) : new Date(b.date)-new Date(a.date));
  const ym={};
  posts.forEach(p=>{
    const d=new Date(p.date), y=d.getFullYear(), m=d.getMonth()+1;
    if(!ym[y]) ym[y]=new Set();
    ym[y].add(m);
  });
  document.getElementById('main').innerHTML = `
    <div class="sort-bar">
      <button class="filter-btn" onclick="document.getElementById('fp').classList.toggle('show')">📅 ${filter?(filter.m?filter.y+'年'+filter.m+'月':filter.y+'年'):'全部时间'}</button>
      <div>
        <button class="${sort==='oldest'?'active':''}" onclick="sort='oldest';showList()">最早优先</button>
        <button class="${sort==='newest'?'active':''}" onclick="sort='newest';showList()">最新优先</button>
      </div>
    </div>
    <div class="filter-panel" id="fp">
      <div onclick="filter=null;showList()" style="cursor:pointer;margin-bottom:8px">全部时间</div>
      ${Object.keys(ym).sort((a,b)=>b-a).map(y=>`
        <div class="year" onclick="filter={y:${y}};showList()">${y}年</div>
        <div class="months">${[...ym[y]].sort((a,b)=>a-b).map(m=>`<span onclick="filter={y:${y},m:${m}};showList()" class="${filter&&filter.y==y&&filter.m==m?'active':''}">${m}月</span>`).join('')}</div>
      `).join('')}
    </div>
    ${list.length?list.map(p=>`<div class="card" onclick="showArticle(${p.id})"><div class="date">${p.date}</div><h2>${p.title}</h2><div class="excerpt">${p.excerpt}</div></div>`).join(''):'<p style="text-align:center;color:var(--light)">暂无文章</p>'}
  `;
  updateAuth();
}

function showArticle(id){
  curId = id;
  const p = posts.find(x=>x.id===id);
  if(!p) return showList();
  let html = p.content;
  highlights.filter(h=>h.postId===id).forEach(h=>{
    if(html.includes(h.text)) html = html.replace(h.text, `<span class="highlight">${h.text}</span>`);
  });
  const cs = comments.filter(c=>c.postId===id);
  document.getElementById('main').innerHTML = `
    <div style="margin-bottom:12px;font-size:14px"><a href="#" onclick="showList();return false">← 返回</a></div>
    <h1 style="font-size:24px;margin-bottom:8px">${p.title}</h1>
    <div style="font-size:13px;color:var(--light);margin-bottom:20px">${p.date} ${isAdmin()?`<a href="#" onclick="editPost(${id});return false" style="margin-left:12px">编辑</a>`:''}</div>
    <div class="content" id="ac">${html}</div>
    <h3 style="margin-bottom:12px">评论</h3>
    ${cs.length?cs.map((c,i)=>`<div class="comment"><div class="floor">${i+1}楼</div><div><span class="user">${c.user}</span><span class="time">${c.time}</span></div><div class="text">${c.text}</div><div class="actions"><span onclick="likeC(${c.id})">♡ ${c.likes||0}</span>${user?`<span onclick="replyC(${c.id})">回复</span>`:''}</div></div>`).join(''):'<p style="color:var(--light);font-size:14px">还没有评论</p>'}
    ${user?`<div style="margin-top:16px"><textarea id="nc" placeholder="写下评论..." style="width:100%;height:70px;padding:10px;border:1px solid var(--border);border-radius:8px"></textarea><button onclick="addC()" style="margin-top:8px;background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:16px;cursor:pointer">发表</button></div>`:'<p style="margin-top:12px;font-size:14px;color:var(--light)">登录后可评论和画线</p>'}
  `;
  const ac = document.getElementById('ac');
  ac.onmouseup = ac.ontouchend = ()=>{
    if(!user) return;
    const t = window.getSelection().toString().trim();
    if(t.length>4){ selText=t; document.getElementById('overlay').style.display='block'; document.getElementById('sheet').classList.add('show'); }
  };
  updateAuth();
}

function editPost(id){
  const p = posts.find(x=>x.id===id);
  document.getElementById('main').innerHTML = `
    <h2 style="margin-bottom:16px">编辑文章</h2>
    <div class="box" style="max-width:100%">
      <input id="et" value="${p.title}">
      <input id="ed" value="${p.date}">
      <textarea id="ec" style="height:260px">${p.content}</textarea>
      <input type="file" accept="image/*" id="ei" style="margin-bottom:12px">
      <button onclick="savePost(${id})">保存</button>
      <button onclick="showArticle(${id})" style="background:var(--border);color:var(--text);margin-left:8px">取消</button>
    </div>`;
  document.getElementById('ei').onchange = function(){
    const f=this.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=e=>{
      const ta=document.getElementById('ec');
      const pos=ta.selectionStart;
      ta.value = ta.value.slice(0,pos)+`<p><img src="${e.target.result}"></p>`+ta.value.slice(pos);
    };
    r.readAsDataURL(f);
  };
}
function savePost(id){
  const p=posts.find(x=>x.id===id);
  p.title=document.getElementById('et').value;
  p.date=document.getElementById('ed').value;
  p.content=document.getElementById('ec').value;
  p.excerpt=p.content.replace(/<[^>]+>/g,'').slice(0,50)+'...';
  save(); showArticle(id);
}
function addC(){
  const t=document.getElementById('nc').value.trim(); if(!t) return;
  comments.push({id:Date.now(),postId:curId,user,text:t,time:new Date().toLocaleString('zh-CN'),likes:0});
  save(); showArticle(curId);
}
function likeC(id){ const c=comments.find(x=>x.id===id); if(c){c.likes=(c.likes||0)+1;save();showArticle(curId)} }
function replyC(id){ const t=prompt('回复：'); if(!t) return; comments.push({id:Date.now(),postId:curId,user,text:'回复：'+t,time:new Date().toLocaleString('zh-CN'),likes:0}); save(); showArticle(curId); }

function closeSheet(){ document.getElementById('overlay').style.display='none'; document.getElementById('sheet').classList.remove('show'); document.getElementById('hlInput').value=''; }
function addHighlight(){
  const c=document.getElementById('hlInput').value.trim();
  if(!c||!selText) return;
  highlights.push({id:Date.now(),postId:curId,text:selText,comment:c,user,likes:0});
  save(); closeSheet(); showArticle(curId);
}
function makeExcerpt(){
  if(!selText) return;
  const p=posts.find(x=>x.id===curId);
  const d=document.createElement('div');
  d.innerHTML=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:flex;align-items:center;justify-content:center" onclick="this.remove()">
    <div style="background:#faf6f1;padding:32px 24px;border-radius:12px;max-width:320px;text-align:center" onclick="event.stopPropagation()">
      <div style="font-size:16px;line-height:1.8;margin-bottom:16px">“${selText}”</div>
      <div style="font-size:13px;color:#8a8075">/ ${p.title}<br>${user||'匿名'} 截图<br>著作权归谢苗</div>
    </div></div>`;
  document.body.appendChild(d); closeSheet();
}

function showLogin(){
  document.getElementById('main').innerHTML=`<div class="box"><h2 style="text-align:center;margin-bottom:16px" id="at">登录</h2>
    <input id="un" placeholder="用户名"><input id="pw" type="password" placeholder="密码">
    <button onclick="doAuth()">登录</button>
    <p style="font-size:12px;text-align:center;margin-top:12px;color:var(--light)" id="ah">还没有账号？<a href="#" onclick="tog();return false">去注册</a><br>管理员 Kokoro / 林科森 密码 admin</p></div>`;
}
let reg=false;
function tog(){ reg=!reg; document.getElementById('at').textContent=reg?'注册':'登录'; document.getElementById('ah').innerHTML=reg?'已有账号？<a href="#" onclick="tog();return false">去登录</a>':'还没有账号？<a href="#" onclick="tog();return false">去注册</a><br>管理员 Kokoro / 林科森 密码 admin'; }
function doAuth(){
  const u=document.getElementById('un').value.trim(), p=document.getElementById('pw').value;
  if(!u||!p) return alert('请填写');
  let us=JSON.parse(localStorage.getItem('mb_users')||'{}');
  if(!us.Kokoro) us.Kokoro='admin';
  if(!us['林科森']) us['林科森']='admin';
  if(reg){ if(us[u]) return alert('已存在'); us[u]=p; localStorage.setItem('mb_users',JSON.stringify(us)); alert('注册成功'); reg=false; showLogin(); return; }
  if(us[u]!==p) return alert('错误');
  user=u; localStorage.setItem('mb_user',u); showList();
}
function updateAuth(){
  document.getElementById('auth').innerHTML = user ? `${user} <a href="#" onclick="user=null;localStorage.removeItem('mb_user');showList();return false">退出</a>` : `<a href="#" onclick="showLogin();return false">登录</a>`;
}

if(localStorage.getItem('miaobo_seen')) document.getElementById('initModal').style.display='none';
setTimeout(showList, 30);
</script>
</body>
</html>
