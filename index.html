  <label for="hlInput" style="display:block;font-size:13px;color:var(--light);margin-bottom:8px">你的评论</label>

    <button type="button" class="cancel" onclick="closeSheet()">取消</button>
    <button type="button" class="ok" onclick="addHighlight()">发表划线评论</button>
  </div>
</div>

<script>
function heartIcon(liked){return '<svg class="heart-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" fill="'+(liked?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>'}
function reactionIsLiked(type,id){return !!session&&likes.some(l=>l.user_id===session.user.id&&l.target_type===type&&same(l.target_id,id))}
function reactionButton(type,id){const liked=reactionIsLiked(type,id);return '<button type="button" class="reaction-button'+(liked?' is-liked':'')+'" data-like-type="'+type+'" data-like-id="'+id+'" aria-pressed="'+liked+'" aria-label="'+(liked?'取消点赞':'点赞')+'" onclick="toggleLike(\''+type+'\',\''+id+'\')">'+heartIcon(liked)+'<span>'+count(type,id)+'</span></button>'}
function updateReactionButtons(){for(const b of document.querySelectorAll('[data-like-type]')){const type=b.dataset.likeType,id=b.dataset.likeId,liked=reactionIsLiked(type,id);b.innerHTML=heartIcon(liked)+'<span>'+count(type,id)+'</span>';b.classList.toggle('is-liked',liked);b.setAttribute('aria-pressed',String(liked));b.setAttribute('aria-label',liked?'取消点赞':'点赞');b.disabled=writing}}
const SEED=[];
function renderReplyQuote(c){if(!c.parent_id)return '';const index=comments.findIndex(x=>same(x.id,c.parent_id));if(index<0)return '<div class="reply-quote reply-unavailable">回复的原评论已不可用</div>';const target=comments[index];return '<button type="button" class="reply-quote" onclick="jumpToComment(\''+esc(target.id)+'\')"><span class="reply-source">回复 '+esc(name(target.user_id))+' · '+(index+1)+'楼</span><span class="reply-preview">'+esc(target.content)+'</span></button>'}
function jumpToComment(id){const target=$('comment-'+id);if(!target)return;target.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});target.classList.add('comment-target');setTimeout(()=>target.classList.remove('comment-target'),1800)}
function selectionToolPosition(viewport,selection,tool,safeBottom=0){const pad=12,gap=14,minX=viewport.left+pad,maxX=Math.max(minX,viewport.left+viewport.width-tool.width-pad),minY=viewport.top+pad,maxY=Math.max(minY,viewport.top+viewport.height-safeBottom-tool.height-24),center=(selection.left+selection.right)/2;const left=Math.max(minX,Math.min(maxX,center-tool.width/2));let placement='above',top=selection.top-tool.height-gap;if(top<minY){placement='below';top=selection.bottom+gap}top=Math.max(minY,Math.min(maxY,top));return {left,top,placement,arrow:Math.max(20,Math.min(tool.width-20,center-left))}}
function fitSelectionTools(){const tools=$('selectionTools'),selection=getSelection();if(!tools||!tools.classList.contains('is-visible')||!hasArticleSelection())return;const vv=window.visualViewport,rawTop=vv?.offsetTop??0,rawHeight=vv?.height??window.innerHeight,headerBottom=document.querySelector('header')?.getBoundingClientRect().bottom??rawTop,top=Math.max(rawTop,headerBottom),viewport={top,left:vv?.offsetLeft??0,width:vv?.width??window.innerWidth,height:Math.max(0,rawTop+rawHeight-top)},safe=parseFloat(getComputedStyle(tools).getPropertyValue('--selection-safe-bottom'))||0;tools.style.maxWidth=Math.max(0,viewport.width-24)+'px';const rects=[...selection.getRangeAt(0).getClientRects()].filter(r=>r.width&&r.height&&r.bottom>viewport.top&&r.top<viewport.top+viewport.height);if(!rects.length){hideSelectionMenu();return}const anchor={top:rects[0].top,bottom:rects[rects.length-1].bottom,left:Math.min(...rects.map(r=>r.left)),right:Math.max(...rects.map(r=>r.right))},size=tools.getBoundingClientRect(),position=selectionToolPosition(viewport,anchor,size,safe);tools.style.bottom='auto';tools.style.top=position.top+'px';tools.style.left=position.left+'px';tools.style.setProperty('--arrow-x',position.arrow+'px');tools.dataset.placement=position.placement}

let articleImageURLs=[];
function releaseArticleImages(){for(const url of articleImageURLs)URL.revokeObjectURL(url);articleImageURLs=[]}
function imageBlobFromDataURL(src){const m=/^data:(image\/(?:jpeg|png|gif|webp));base64,([\s\S]+)$/i.exec(src);if(!m)return null;const binary=atob(m[2].replace(/\s/g,'')),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:m[1].toLowerCase()})}
function setupArticleImages(){const root=$('ac');if(!root)return;const images=[...root.querySelectorAll('img')];let warnings=$('imageWarnings');if(warnings)warnings.remove();warnings=document.createElement('div');warnings.id='imageWarnings';warnings.className='image-warnings';warnings.hidden=true;warnings.setAttribute('role','status');const label=document.createElement('span'),retry=document.createElement('button');retry.type='button';retry.textContent='重试加载';warnings.append(label,retry);root.after(warnings);const failed=new Set(),retriers=[];const update=()=>{if(!warnings.isConnected)return;warnings.hidden=failed.size===0;label.textContent=failed.size+' 张图片暂未显示。'};for(const img of images){const original=img.getAttribute('src');if(!original)continue;let fallback=false;img.loading='eager';img.style.maxWidth='100%';img.style.height='auto';const createSource=()=>{const blob=imageBlobFromDataURL(original);if(!blob)return original;const url=URL.createObjectURL(blob);articleImageURLs.push(url);return url};img.onload=()=>{failed.delete(img);update()};img.onerror=()=>{if(!img.isConnected)return;if(!fallback&&original.startsWith('data:')){fallback=true;img.src=original;return}failed.add(img);update()};const load=()=>{failed.delete(img);fallback=false;try{img.src=createSource()}catch{fallback=true;img.src=original}update()};retriers.push([img,load]);if(original.startsWith('data:'))load();else if(img.complete&&img.naturalWidth===0){failed.add(img);update()}}retry.onclick=()=>{for(const [img,load] of retriers)if(failed.has(img))load()}}
function articleDate(value,display=true){const d=new Date(value);if(isNaN(d))return '';const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const get=k=>parts.find(p=>p.type===k).value;return display?get('year')+'年'+Number(get('month'))+'月'+Number(get('day'))+'日':get('year')+'-'+get('month')+'-'+get('day')}
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}

const heatScore=id=>{const n=postStats[id];return n?Number(n.like_count)+Number(n.comment_count)*2+Number(n.highlight_count)*2:0};
function comparePosts(a,b){if(sort==='hot')return heatScore(b.id)-heatScore(a.id)||new Date(b.date)-new Date(a.date)||Number(b.id)-Number(a.id);return (new Date(a.date)-new Date(b.date))*(sort==='oldest'?1:-1)}
function postCounters(id){const n=postStats[id];return '<div class="post-counters"><span>♡ '+(n?.like_count??'—')+'</span><span>评论 '+(n?.comment_count??'—')+'</span><span>划线 '+(n?.highlight_count??'—')+'</span></div>'}
function postIsLiked(id){return !!session&&postStats[id]?.viewer===session.user.id&&postStats[id]?.is_liked}
function updatePostLikeUI(){const b=$('postLikeButton');if(!b)return;const liked=postIsLiked(curId);b.innerHTML=heartIcon(liked);b.setAttribute('aria-label',(liked?'取消文章点赞':'点赞这篇文章')+'，共 '+(postStats[curId]?.like_count??'—')+' 赞');b.title=(liked?'已点赞，可点击取消':'点赞')+' · '+(postStats[curId]?.like_count??'—');b.setAttribute('aria-pressed',String(liked));b.classList.toggle('is-liked',liked);b.disabled=!statsReady||writing}
async function loadPostStats(v,redraw=true){try{const rows=await query(sb.rpc('miaobo_post_stats'));if(v!==version)return false;const viewer=session?.user.id??null;postStats=Object.fromEntries(rows.map(n=>[n.post_id,{...n,viewer}]));statsReady=true;store('mb_post_stats',JSON.stringify(Object.fromEntries(rows.map(n=>[n.post_id,{...n,is_liked:false,viewer:null}]))));if(redraw&&curId===null&&!editingPost&&!$('authSubmit'))renderList();else updatePostLikeUI();return true}catch(e){if(v===version){updatePostLikeUI();if(curId===null&&!editingPost&&!$('authSubmit'))status('已加载，互动统计暂不可用');}return false}}
async function togglePostLike(){if(writing||!needAuth())return;if(!statsReady)return notice('互动数据暂不可用，请稍后重试');const id=curId,wasLiked=postIsLiked(id),v=version;writing=true;updatePostLikeUI();try{await query(wasLiked?sb.from('post_likes').delete().eq('post_id',id).eq('user_id',session.user.id):sb.from('post_likes').insert({post_id:id,user_id:session.user.id}));if(v!==version)return;const n=postStats[id];if(n)postStats[id]={...n,like_count:Math.max(0,Number(n.like_count)+(wasLiked?-1:1)),is_liked:!wasLiked,viewer:session.user.id};const fresh=await loadPostStats(v,false);if(!fresh)notice('点赞已保存，统计暂未刷新')}catch(e){if(e.code==='23505'){await loadPostStats(v,false)}else notice('点赞未完成：'+e.message)}finally{writing=false;updatePostLikeUI()}}

function store(k,v){try{localStorage.setItem(k,v);return true}catch{notice('浏览器存储不可用，请备份未发布内容');return false}}
function notice(t){$('toast')?.remove();const n=document.createElement('div');n.id='toast';n.role='status';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),6000)}
let editingPost=false;
let sb;try{sb=window.supabase.createClient('https://qldfmpfcoxxwgctlfeua.supabase.co','sb_publishable_nemB3Smiq4Bmtm_6SpIvig_T-9BJhvT')}catch{}
let posts=read('mb_v2_posts',[]),comments=[],highlights=[],likes=[],profiles=[],session=null,profile=null,user=null,sort='newest',filter=null,curId=null,selText='',selectionStart=0,reg=false,version=0;
const same=(a,b)=>String(a)===String(b), isAdmin=()=>!!profile?.is_admin;
function clean(raw){const t=document.createElement('template');t.innerHTML=raw||'';const allowed=new Set(['DIV','P','BR','IMG','STRONG','EM','B','I','BLOCKQUOTE','UL','OL','LI','H2','H3','A']);for(const e of [...t.content.querySelectorAll('*')]){if(!allowed.has(e.tagName)){e.replaceWith(document.createTextNode(e.textContent));continue}for(const a of [...e.attributes])if(!['href','src','alt'].includes(a.name))e.removeAttribute(a.name);for(const a of ['href','src'])if(e.hasAttribute(a)&&!(/^(https?:\/\/|data:image\/(png|jpeg|webp|gif);base64,)/i.test(e.getAttribute(a))))e.removeAttribute(a);if(e.tagName==='A')e.setAttribute('rel','noopener noreferrer')}return t.innerHTML}
async function query(q){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);try{const r=await q.abortSignal(controller.signal);if(r.error)throw r.error;return r.data}catch(e){if(controller.signal.aborted)throw Error('响应超时，暂时无法确认是否已保存，请先刷新查看，避免重复发布');throw e}finally{clearTimeout(timer)}}
async function bounded(p){let timer;try{return await Promise.race([p,new Promise((_,reject)=>timer=setTimeout(()=>reject(Error('连接超时')),8000))])}finally{clearTimeout(timer)}}
function status(t){$('status').textContent=t}
function authUI(){$('auth').replaceChildren();if(user){$('auth').append(document.createTextNode(user+' '));const b=document.createElement('button');b.textContent='退出';b.className='quiet-button';b.onclick=logout;$('auth').append(b)}else{$('auth').innerHTML='<a href="#" onclick="showLogin();return false">登录</a>'}}
async function refreshAuth(){session=(await bounded(sb.auth.getSession())).data.session;user=null;profile=null;if(session){profile=(await query(sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle()));user=profile?.username||session.user.user_metadata.username||'读者'}authUI();if(curId===null&&!editingPost&& !$('authSubmit'))renderList()}
function showList(){releaseArticleImages();pendingArticleRender=null;articleTouchActive=false;hideSelectionMenu();editingPost=false;curId=null;version++;renderList();loadPosts()}
async function loadPosts(){const v=version;status(posts.length?'正在同步…':'正在读取…');if(!sb){status('离线阅读 · 当前内容来自本机缓存');return}try{const data=await query(sb.from('posts').select('*').order('published_at'));if(v!==version)return;posts=data.map(p=>({...p,date:p.published_at}));store('mb_v2_posts',JSON.stringify(posts));status(data.length?'已连接':'暂无，管理员登录后可发布');renderList();loadPostStats(v)}catch(e){if(v===version)status('离线阅读 · '+e.message+' · 显示本机缓存')}}
function renderList(){authUI();const ym={};for(const p of posts){const d=new Date(p.date);if(!isNaN(d)){(ym[d.getFullYear()]??=new Set()).add(d.getMonth()+1)}}let list=posts.filter(p=>!filter||(new Date(p.date).getFullYear()===filter.y&&(!filter.m||new Date(p.date).getMonth()+1===filter.m)));list.sort(comparePosts);$('main').innerHTML=`${isAdmin()?'<div style="margin-bottom:16px"><button onclick="newPost()">＋ 写文章</button></div>':''}<div class="sort-bar"><button onclick="$('fp').classList.toggle('show')">${filter?filter.y+'年'+(filter.m?filter.m+'月':''):'全部时间'}</button><div><button class="${sort==='oldest'?'active':''}" onclick="sort='oldest';renderList()">最早优先</button> <button class="${sort==='newest'?'active':''}" onclick="sort='newest';renderList()">最新优先</button> <button class="${sort==='hot'?'active':''}" onclick="if(statsReady){sort='hot';renderList()}else notice('互动数据暂不可用，请稍后重试')" title="点赞＋评论×2＋划线评论×2">热度优先</button></div></div><div id="fp" class="filter-panel"><button onclick="filter=null;renderList()">全部时间</button>${Object.keys(ym).reverse().map(y=>`<div class="year" onclick="filter={y:${y}};renderList()">${y}年</div><div class="months">${[...ym[y]].sort((a,b)=>a-b).map(m=>`<span onclick="filter={y:${y},m:${m}};renderList()">${m}月</span>`).join('')}</div>`).join('')}</div>${list.map(p=>`<article class="card" tabindex="0" role="button" onclick="showArticle('${esc(p.id)}')" onkeydown="if(event.key==='Enter')this.click()"><div class="date">${esc(articleDate(p.date))}</div><h2>${esc(p.title)}</h2><div class="excerpt">${esc(p.excerpt)}</div>${postCounters(p.id)}</article>`).join('')||'<p>暂无</p>'}`}
async function showArticle(id){curId=id;const v=++version;let p=posts.find(p=>same(p.id,id));if(!p)return showList();comments=read('mb_v2_comments_'+id,[]);highlights=read('mb_v2_highlights_'+id,[]);renderArticle(p);if(sb)loadPostStats(v,false);if(!sb){status('离线阅读 · 当前来自本机缓存');return}status('正在同步和图片…');const articleRequest=query(sb.from('posts').select('*').eq('id',id).single());const discussionRequest=Promise.all([query(sb.from('comments').select('*').eq('post_id',id).order('created_at')),query(sb.from('highlights').select('*').eq('post_id',id).order('created_at')),query(sb.from('profiles').select('id,username')),query(sb.from('likes').select('*'))]);const [articleResult,discussionResult]=await Promise.allSettled([articleRequest,discussionRequest]);if(v!==version)return;let articleError='',discussionError='';if(articleResult.status==='fulfilled'){p={...articleResult.value,date:articleResult.value.published_at};posts=posts.map(x=>same(x.id,id)?p:x);store('mb_v2_posts',JSON.stringify(posts))}else articleError=articleResult.reason.message;if(discussionResult.status==='fulfilled'){[comments,highlights,profiles,likes]=discussionResult.value;store('mb_v2_comments_'+id,JSON.stringify(comments));store('mb_v2_highlights_'+id,JSON.stringify(highlights))}else discussionError=discussionResult.reason.message;renderArticle(p);status(articleError?'同步失败，显示本机缓存 · '+articleError:discussionError?'和图片已同步；评论读取失败 · '+discussionError:'已连接')}

function renderArticle(p){if($('ac')&&(articleTouchActive||hasArticleSelection()||$('sheet').classList.contains('show')||document.activeElement?.matches?.('input,textarea,[contenteditable=true]'))){pendingArticleRender=p;return}pendingArticleRender=null;selectionMenuDismissed=false;hideSelectionMenu();releaseArticleImages();$('main').innerHTML=`<a href="#" onclick="showList();return false">← 返回</a><h1>${esc(p.title)}</h1><p>${esc(articleDate(p.date))} ${isAdmin()?'<button onclick="editPost()">编辑</button>':''}</p><div class="content" id="ac">${clean(p.content)}</div><div class="article-interactions"><span>喜欢这篇，就点个赞吧！</span><button id="postLikeButton" type="button" onclick="togglePostLike()" aria-pressed="false" aria-label="点赞这篇文章">${heartIcon(false)}</button></div><h3>评论 · ${comments.length}</h3>${comments.map((c,i)=>`<div class="comment" id="comment-${c.id}"><div class="floor">${i+1}楼 · ${esc(new Date(c.created_at).toLocaleString('zh-CN'))}</div><b>${esc(name(c.user_id))}</b>${renderReplyQuote(c)}<div class="text">${esc(c.content)}</div>${reactionButton('comment',c.id)} <button onclick="replyC('${c.id}')">回复</button>${isAdmin()?` <button class="danger-button" onclick="removeEntry('comments','${c.id}')">删除</button>`:''}</div>`).join('')||'<p>还没有评论</p>'}<div class="box"><textarea id="nc" maxlength="4000" placeholder="评论整篇…（登录后发表）"></textarea><button onclick="addC()">发表评论</button><p style="font-size:12px">${esc(read('mb_draft_'+curId,'')?'已恢复本机草稿':'选中正文可划线评论或生成书摘')}</p></div>`;$('nc').value=read('mb_draft_'+curId,'');$('nc').oninput=()=>store('mb_draft_'+curId,JSON.stringify($('nc').value));updatePostLikeUI();paintHighlights();setupArticleImages();mountSelectionTools();$('ac').onpointerdown=()=>{articleTouchActive=true};$('ac').onpointerup=$('ac').onpointercancel=()=>{articleTouchActive=false};authUI()}

function paintHighlights(){const root=$('ac'),walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];let n,offset=0;while(n=walker.nextNode()){nodes.push({n,start:offset});offset+=n.length}const text=root.textContent;const spans=highlights.map(h=>{const saved=h.start_offset;const start=Number.isInteger(saved)&&text.slice(saved,saved+h.selected_text.length)===h.selected_text?saved:text.indexOf(h.selected_text);return {h,start,end:start+h.selected_text.length}}).filter(x=>x.start>=0);for(const {n,start} of nodes){const cuts=new Set([0,n.length]);for(const s of spans){if(s.start<start+n.length&&s.end>start){cuts.add(Math.max(0,s.start-start));cuts.add(Math.min(n.length,s.end-start))}}const points=[...cuts].sort((a,b)=>a-b),frag=document.createDocumentFragment();for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1],s=spans.find(x=>x.start<=start+a&&x.end>=start+b);const el=s?document.createElement('mark'):document.createTextNode(n.data.slice(a,b));if(s)el.textContent=n.data.slice(a,b);if(s){el.className='highlight';el.setAttribute('aria-label','查看这段文字的评论');let downAt=0,moved=false;el.onpointerdown=()=>{downAt=Date.now();moved=false};el.onpointermove=()=>{moved=true};el.onclick=()=>{if(moved||Date.now()-downAt>300||hasArticleSelection())return;showHLComments(s.h.selected_text)}}frag.append(el)}n.replaceWith(frag)}}
function needAuth(){if(session)return true;notice('请先登录账号');return false}
let writing=false;
async function write(action){if(writing||!needAuth())return;writing=true;try{await action();notice('已保存');await showArticle(curId)}catch(e){notice('保存失败：'+e.message+'。草稿保留在本机，可重试')}finally{writing=false}}
function addC(parent=null,text=null){const content=text??$('nc').value.trim();if(!content)return;write(async()=>{await query(sb.from('comments').insert({post_id:curId,user_id:session.user.id,content,parent_id:parent}).select().single());store('mb_draft_'+curId,JSON.stringify(''))})}
function replyC(id){if(!needAuth())return;const c=comments.find(c=>same(c.id,id)),t=prompt('回复 '+name(c.user_id)+' · '+(comments.indexOf(c)+1)+'楼\n“'+c.content.slice(0,80)+'”\n\n你的回复：');if(t?.trim()){$('nc').value=t;store('mb_draft_'+curId,JSON.stringify(t));addC(id,t.trim())}}
function addHighlight(){const comment=$('hlInput').value.trim();if(!selText)return;if(!comment)return notice('请先填写你的评论');store('mb_highlight_draft',JSON.stringify({postId:curId,text:selText,comment,start:selectionStart}));write(async()=>{await query(sb.from('highlights').insert({post_id:curId,user_id:session.user.id,selected_text:selText,comment,start_offset:selectionStart}).select().single());store('mb_highlight_draft','null');closeSheet()})}
async function toggleLike(type,id){if(writing||!needAuth())return;const l=likes.find(l=>l.user_id===session.user.id&&l.target_type===type&&same(l.target_id,id)),v=version;writing=true;updateReactionButtons();try{if(l){await query(sb.from('likes').delete().eq('id',l.id));if(v===version)likes=likes.filter(x=>!same(x.id,l.id))}else{const row=await query(sb.from('likes').insert({user_id:session.user.id,target_type:type,target_id:id}).select().single());if(v===version)likes=[...likes,row]}}catch(e){if(e.code==='23505'){try{const rows=await query(sb.from('likes').select('*'));if(v===version)likes=rows}catch{notice('点赞状态暂未同步，请稍后重试')}}else notice('点赞未完成：'+e.message)}finally{writing=false;updateReactionButtons()}}

function removeEntry(table,id){if(isAdmin()&&confirm('删除这条评论？'))write(()=>query(sb.from(table).delete().eq('id',id)))}
function showHLComments(text){$('highlightDiscussion')?.remove();const related=highlights.filter(h=>h.selected_text===text),overlay=document.createElement('div');overlay.id='highlightDiscussion';overlay.className='modal-overlay hl-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','划线评论');const box=document.createElement('section');box.className='hl-panel';const previous=document.activeElement;const close=()=>{overlay.remove();document.removeEventListener('keydown',keyHandler);if(previous?.isConnected)previous.focus()};const keyHandler=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const buttons=[...box.querySelectorAll('button')],first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};const head=document.createElement('div');head.className='hl-heading';const title=document.createElement('h3');title.textContent='划线评论 · '+related.length;const dismiss=document.createElement('button');dismiss.type='button';dismiss.className='hl-dismiss';dismiss.textContent='×';dismiss.setAttribute('aria-label','关闭评论');dismiss.onclick=close;head.append(title,dismiss);const quote=document.createElement('blockquote');quote.className='hl-quote';quote.textContent=text;box.append(head,quote);const list=document.createElement('div');list.className='hl-list';for(const h of related){const item=document.createElement('article');item.className='hl-item';const author=document.createElement('b');author.textContent=name(h.user_id);const p=document.createElement('p');p.className='hl-body';p.textContent=h.comment;const actions=document.createElement('div');actions.className='hl-actions';const b=document.createElement('button');b.type='button';b.className='reaction-button';b.dataset.likeType='highlight';b.dataset.likeId=h.id;const liked=reactionIsLiked('highlight',h.id);b.innerHTML=heartIcon(liked)+'<span>'+count('highlight',h.id)+'</span>';b.classList.toggle('is-liked',liked);b.setAttribute('aria-label',liked?'取消点赞':'点赞');b.setAttribute('aria-pressed',String(liked));b.onclick=()=>toggleLike('highlight',h.id);actions.append(b);if(isAdmin()){const del=document.createElement('button');del.type='button';del.className='danger-button';del.textContent='删除';del.onclick=()=>{close();removeEntry('highlights',h.id)};actions.append(del)}item.append(author,p,actions);list.append(item)}box.append(list);overlay.append(box);overlay.onclick=e=>{if(e.target===overlay)close()};document.addEventListener('keydown',keyHandler);document.body.append(overlay);dismiss.focus()}

function fitHighlightSheet(){if(!$('sheet').classList.contains('show'))return;const viewport=window.visualViewport;const gap=viewport?Math.max(0,window.innerHeight-viewport.height-viewport.offsetTop):0;$('sheet').style.bottom=gap+'px';$('sheet').style.maxHeight=Math.max(160,(viewport?.height??window.innerHeight)-24)+'px'}
function openHighlightSheet(){selectionMenuDismissed=true;hideSelectionMenu();$('selectedQuote').textContent=selText;$('overlay').style.display='block';$('sheet').classList.add('show');$('sheet').setAttribute('aria-hidden','false');$('main').inert=true;fitHighlightSheet();$('hlInput').focus()}
function closeSheet(){$('hlInput').blur();$('overlay').style.display='none';$('sheet').classList.remove('show');$('sheet').setAttribute('aria-hidden','true');$('sheet').style.bottom='';$('sheet').style.maxHeight='';$('main').inert=false;$('hlInput').value=''}
window.visualViewport?.addEventListener('resize',fitHighlightSheet);
window.visualViewport?.addEventListener('scroll',fitHighlightSheet);
async function makeExcerpt(){if(!selText)return;await document.fonts.ready;const p=posts.find(p=>same(p.id,curId)),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');const wrap=(text,max)=>{const lines=[];for(const paragraph of text.split('\n')){let line='';for(const c of paragraph){if(ctx.measureText(line+c).width>max&&line){lines.push(line);line=''}line+=c}lines.push(line)}return lines};ctx.font='28px "Microsoft YaHei",sans-serif';const lines=wrap(selText,540);if(lines.length>150)return notice('选文过长，请分段生成书摘');ctx.font='24px "Microsoft YaHei",sans-serif';const titles=wrap('/《'+p.title.replace(/^《([\s\S]*)》$/,'$1')+'》',540);canvas.width=660;canvas.height=230+lines.length*48+titles.length*40;ctx.fillStyle='#faf6f1';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#3a3530';ctx.font='28px "Microsoft YaHei",sans-serif';lines.forEach((l,i)=>ctx.fillText(l,60,80+i*48));let y=110+lines.length*48;ctx.fillStyle='#8a8075';ctx.font='24px "Microsoft YaHei",sans-serif';titles.forEach(l=>{ctx.fillText(l,60,y);y+=40});ctx.font='22px "Microsoft YaHei",sans-serif';ctx.fillText('By 谢苗',60,y);ctx.fillStyle='#a69a8d';ctx.font='17px "Microsoft YaHei",sans-serif';ctx.fillText('苗博·演员谢苗超话',60,y+40);canvas.toBlob(blob=>{if(!blob)return notice('图片生成失败');const url=URL.createObjectURL(blob),overlay=document.createElement('div');overlay.className='modal-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','书摘预览');overlay.setAttribute('aria-modal','true');overlay.style.cssText='padding:24px;background:rgba(0,0,0,.58);backdrop-filter:blur(3px)';const box=document.createElement('div');box.style.cssText='width:min(100%,320px);text-align:center;position:relative';const img=new Image();img.src=url;img.alt='书摘图片，长按保存';img.style.cssText='display:block;width:100%;max-height:68dvh;object-fit:contain;border-radius:5px;box-shadow:0 12px 40px #0003';const b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label','关闭书摘');b.style.cssText='display:block;margin:18px auto 0;width:36px;height:36px;border:1px solid #ffffff70;border-radius:50%;background:transparent;color:white;font-size:26px;line-height:30px;padding:0';const previous=document.activeElement;const close=()=>{overlay.remove();URL.revokeObjectURL(url);document.removeEventListener('keydown',onKey);if(previous?.isConnected)previous.focus()};const onKey=e=>{if(e.key==='Escape'){e.stopImmediatePropagation();close()}if(e.key==='Tab'){e.preventDefault();b.focus()}};b.onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};document.addEventListener('keydown',onKey);const tip=document.createElement('p');tip.textContent='长按图片保存';tip.style.cssText='margin:14px 0 0;color:#ffffffb3;font-size:12px;letter-spacing:1px';box.append(img,tip,b);overlay.append(box);document.body.append(overlay);b.focus()},'image/png');closeSheet()}
function newPost(){if(!isAdmin())return;curId=null;editPost()}
let editorRange=null;
function keepEditorSelection(){const selection=getSelection();if(selection.rangeCount&&$('ec')?.contains(selection.anchorNode))editorRange=selection.getRangeAt(0).cloneRange()}
function insertEditorHTML(html){const editor=$('ec');editor.focus();const selection=getSelection();if(editorRange&&editor.contains(editorRange.commonAncestorContainer)){selection.removeAllRanges();selection.addRange(editorRange)}else{const range=document.createRange();range.selectNodeContents(editor);range.collapse(false);selection.removeAllRanges();selection.addRange(range)}document.execCommand('insertHTML',false,clean(html));keepEditorSelection();saveEditorDraft()}
function saveEditorDraft(){if(!$('ec'))return;store('mb_editor_'+(curId??'new'),JSON.stringify({title:$('et').value,date:$('ed').value,content:$('ec').innerHTML}))}
async function uploadEditorImage(file){if(!file||!file.type.startsWith('image/'))return notice('请选择图片文件');if(file.size>25000000)return notice('图片过大，请选择小于 25 MB 的照片');try{const source=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('图片读取失败'));reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)});let data=source;if(file.size>1200000||!/^image\/(jpeg|png|gif|webp)$/.test(file.type)){const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('此照片格式暂不支持，请在相册中转为 JPG 后添加'));img.src=source});const scale=Math.min(1,1600/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);data=canvas.toDataURL('image/jpeg',.82)}if(!$('ec'))return;insertEditorHTML('<p><img src="'+data+'" alt="配图"></p><p><br></p>')}catch(e){notice(e.message)}}

function editPost(){if(!isAdmin())return;releaseArticleImages();hideSelectionMenu();editingPost=true;version++;editorRange=null;const p=posts.find(p=>same(p.id,curId))||{title:'',date:new Date().toISOString(),content:''};const draft=read('mb_editor_'+(curId??'new'),null);$('main').innerHTML=`<h2 style="margin-bottom:16px">${curId===null?'写文章':'编辑'}</h2><div class="box" style="max-width:100%;margin:0"><label>标题<input id="et" placeholder="填写标题"></label><label>原文日期<input id="ed" type="date"></label><div style="display:flex;align-items:center;gap:12px;margin:8px 0"><b>正文</b><button type="button" onclick="keepEditorSelection();$('ei').click()">＋ 从相册添加图片</button><input id="ei" type="file" accept="image/*" multiple hidden style="display:none!important" aria-label="选择图片"></div><div id="ec" class="content article-editor" contenteditable="true" role="textbox" aria-label="正文" aria-multiline="true" style="min-height:320px;max-height:65dvh;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere"></div><p style="font-size:12px;color:var(--light);margin:8px 0 16px">直接编辑文字和图片，发布后保持这里的排版。未发布内容自动保留在本机。</p><p id="publishMessage" role="status" style="font-size:14px;margin-bottom:12px"></p><button id="publishButton" onclick="savePost()">${curId===null?'发布':'保存修改'}</button> <button onclick="if(!writing){editingPost=false;curId===null?showList():showArticle(curId)}">返回</button></div>`;$('et').value=draft?.title??p.title;$('ed').value=draft?.date?.slice(0,10)??articleDate(p.date,false);$('ec').innerHTML=clean(draft?.content??p.content);$('ec').querySelectorAll('img').forEach(img=>img.style.maxWidth='100%');$('ec').oninput=saveEditorDraft;$('et').oninput=$('ed').oninput=saveEditorDraft;$('ec').onkeyup=$('ec').onmouseup=keepEditorSelection;$('ec').onpaste=e=>{e.preventDefault();keepEditorSelection();const image=[...e.clipboardData.files].find(f=>f.type.startsWith('image/'));if(image)return uploadEditorImage(image);const html=e.clipboardData.getData('text/html');insertEditorHTML(html||esc(e.clipboardData.getData('text/plain')).replace(/\n/g,'<br>'))};$('ei').onchange=async()=>{const files=[...$('ei').files];$('ei').value='';for(const file of files)await uploadEditorImage(file)};if(draft)$('publishMessage').textContent='已恢复上次未发布的草稿。'}
async function savePost(){if(!isAdmin()||writing||!needAuth())return;const title=$('et').value.trim(),date=new Date($('ed').value+'T00:00:00+08:00'),content=clean($('ec').innerHTML),div=document.createElement('div');div.innerHTML=content;if(!title||isNaN(date)||(!div.textContent.trim()&&!div.querySelector('img')))return $('publishMessage').textContent='请填写标题、时间和正文。';saveEditorDraft();const oldId=curId,button=$('publishButton');writing=true;button.disabled=true;button.textContent='正在保存…';$('publishMessage').textContent='正在上传，请稍候…';try{const payload={title,content,excerpt:div.textContent.slice(0,100),published_at:date.toISOString(),updated_at:new Date().toISOString()},q=oldId===null?sb.from('posts').insert(payload):sb.from('posts').update(payload).eq('id',oldId);const row=await query(q.select().single()),p={...row,date:row.published_at};posts=oldId===null?[...posts,p]:posts.map(x=>same(x.id,oldId)?p:x);store('mb_v2_posts',JSON.stringify(posts));store('mb_editor_'+(oldId??'new'),'null');curId=row.id;editingPost=false;notice(oldId===null?'发布成功':'修改已保存');await showArticle(row.id)}catch(e){if($('publishMessage'))$('publishMessage').textContent='保存未完成：'+e.message+'。草稿已保留。'}finally{writing=false;if(button.isConnected){button.disabled=false;button.textContent=oldId===null?'发布':'保存修改'}}}

let authBusy=false;
function authMessage(text,kind='error'){const el=$('authMessage');if(el){el.textContent=text;el.style.color=kind==='error'?'#a33128':kind==='success'?'#367246':'#795b3e'}else notice(text)}
function showLogin(){if(authBusy)return;releaseArticleImages();hideSelectionMenu();curId=null;version++;$('main').innerHTML=`<form class="box" novalidate onsubmit="event.preventDefault();doAuth()"><h2>${reg?'注册':'登录'}</h2><label>用户名<input id="un" required maxlength="40" autocomplete="username"></label><label>密码<input id="pw" required type="password" autocomplete="${reg?'new-password':'current-password'}"></label><p id="authMessage" role="status" aria-live="polite" style="font-size:14px;white-space:pre-wrap;margin-bottom:12px"></p><button id="authSubmit" type="submit">${reg?'注册':'登录'}</button><p><a href="#" onclick="if(!authBusy){reg=!reg;showLogin()}return false">${reg?'已有账号？登录':'注册账号'}</a></p></form>`}
function authError(e){const m=e?.message||String(e);if(/Invalid login credentials/i.test(m))return '用户名或密码不正确；请确认已经注册账号。';if(/Email not confirmed/i.test(m))return '账号邮箱尚未验证。当前用户名使用虚拟邮箱，无法接收验证邮件，需要管理员检查 Supabase 邮箱确认配置。';if(/invalid.*email|email.*invalid/i.test(m))return '不接受当前虚拟邮箱：'+m;if(/Database error saving new user/i.test(m))return '账号创建时数据库报错，请检查 Auth 日志和 profiles 注册触发器。原始错误：'+m;if(/fetch|network|timeout|连接超时/i.test(m))return '连接超时或网络失败，暂时无法确认操作结果。请先到 Supabase Users 查看是否已创建账号，再重试登录。';if(/already registered/i.test(m))return '账号已经注册，请切换登录。';return '返回：'+m}

function emailFor(u){return /^[\x21-\x7e]+$/.test(u)?u.toLowerCase()+'@miaobo.local':Array.from(new TextEncoder().encode(u)).map(b=>b.toString(16).padStart(2,'0')).join('')+'@miaobo.local'}
async function doAuth(){if(authBusy)return;if(!sb)return authMessage('登录服务未加载，可能是 CDN 网络失败，请刷新页面后重试。');const u=$('un').value.trim().normalize('NFC'),password=$('pw').value;if(!u||!password)return authMessage('请填写用户名和密码。');if(u.length>40)return authMessage('用户名最多 40 个字符。');if(reg&&password.length<6)return authMessage('注册密码至少 6 位，请设置新密码；admin 是旧版本地密码。');const registering=reg,button=$('authSubmit');authBusy=true;button.disabled=true;button.textContent=registering?'正在注册…':'正在登录…';authMessage(registering?'正在连接并创建账号…':'正在验证账号…','progress');try{const r=await bounded(registering?sb.auth.signUp({email:emailFor(u),password,options:{data:{username:u}}}):sb.auth.signInWithPassword({email:emailFor(u),password}));if(r.error)throw r.error;if(!r.data?.session){authMessage(registering?'注册请求已返回，但未获得登录会话。请到 Supabase → Authentication → Users 确认账号是否创建；若需要邮箱确认，虚拟邮箱无法收信，请管理员检查确认设置。':'未返回登录会话，请重试。','error');return}session=r.data.session;user=session.user.user_metadata?.username||u;profile=null;let warning='';try{profile=await query(sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle());if(profile)user=profile.username;else warning='账号资料未创建，请检查 profiles 注册触发器。'}catch(e){warning='账号已登录，但资料读取失败：'+e.message}authUI();showList();status((registering?'注册成功，已登录':'登录成功')+' · '+user+(warning?' · '+warning:''));notice(registering?'注册成功，已登录':'登录成功')}catch(e){authMessage(authError(e))}finally{authBusy=false;if(button.isConnected){button.disabled=false;button.textContent=registering?'注册':'登录'}}}

async function logout(){try{const r=await bounded(sb.auth.signOut());if(r.error)throw r.error;session=profile=user=null;authUI();showList()}catch(e){notice('退出失败：'+e.message)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
if(read('miaobo_seen',false))$('initModal').style.display='none';
showList();if(sb){refreshAuth().then(()=>{if(curId)showArticle(curId)}).catch(e=>notice('登录状态读取失败：'+e.message));sb.auth.onAuthStateChange(()=>{setTimeout(()=>refreshAuth().catch(()=>{}),0)})}
