<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苗博</title>
<style>
:root {
  --bg: #faf6f1;
  --bg-card: #ffffff;
  --text: #3a3530;
  --text-light: #8a8075;
  --accent: #d4a574;
  --accent-warm: #e8c4a0;
  --highlight: #f5e6d3;
  --border: #ebe4db;
  --shadow: 0 2px 12px rgba(180, 140, 100, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-size: 16px;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Header */
header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
header img.logo {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
}
header .title {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 1px;
}
header .subtitle {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 1px;
}
header .right {
  margin-left: auto;
  font-size: 14px;
  color: var(--text-light);
}
header .right a { margin-left: 12px; }

/* Main */
main { max-width: 680px; margin: 0 auto; padding: 20px 16px 80px; }

/* Sort bar */
.sort-bar {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 16px;
  font-size: 13px;
}
.sort-bar button {
  background: none;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 4px 12px;
  color: var(--text-light);
  cursor: pointer;
}
.sort-bar button.active {
  background: var(--accent-warm);
  color: var(--text);
  border-color: var(--accent);
}

/* Article list */
.article-card {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.15s;
}
.article-card:hover { transform: translateY(-2px); }
.article-card .date {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 6px;
}
.article-card h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 6px;
}
.article-card .excerpt {
  font-size: 14px;
  color: #666;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Article page */
.article-header { margin-bottom: 24px; }
.article-header .back {
  font-size: 14px;
  color: var(--text-light);
  margin-bottom: 12px;
  display: inline-block;
}
.article-header h1 {
  font-size: 24px;
  line-height: 1.4;
  margin-bottom: 8px;
}
.article-header .meta {
  font-size: 13px;
  color: var(--text-light);
}
.article-content {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 24px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}
.article-content p { margin-bottom: 16px; }
.article-content img {
  max-width: 100%;
  border-radius: 8px;
  margin: 12px 0;
}
.highlight {
  background: var(--highlight);
  border-bottom: 2px solid var(--accent);
  cursor: pointer;
  border-radius: 2px;
  padding: 0 2px;
}

/* Comments */
.comments-section h3 {
  font-size: 16px;
  margin-bottom: 16px;
  font-weight: 600;
}
.comment {
  background: var(--bg-card);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.comment .floor {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 4px;
}
.comment .user {
  font-weight: 600;
  font-size: 14px;
}
.comment .time {
  font-size: 12px;
  color: var(--text-light);
  margin-left: 8px;
}
.comment .text { margin: 8px 0; font-size: 15px; }
.comment .actions {
  font-size: 13px;
  color: var(--text-light);
  display: flex;
  gap: 16px;
}
.comment .actions span { cursor: pointer; }
.comment .actions .liked { color: #e07a5f; }

/* Bottom sheet for highlight */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  display: none;
}
.bottom-sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  border-radius: 16px 16px 0 0;
  padding: 20px;
  z-index: 201;
  transform: translateY(100%);
  transition: transform 0.25s ease;
}
.bottom-sheet.show { transform: translateY(0); }
.bottom-sheet textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-size: 15px;
  resize: none;
  height: 80px;
  font-family: inherit;
}
.bottom-sheet .btns {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  justify-content: flex-end;
}
.bottom-sheet button {
  padding: 8px 18px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}
.bottom-sheet .cancel { background: var(--border); color: var(--text); }
.bottom-sheet .submit { background: var(--accent); color: white; }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 28px 24px;
  max-width: 320px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.modal h3 { margin-bottom: 12px; font-size: 18px; }
.modal p { font-size: 14px; color: var(--text-light); margin-bottom: 20px; line-height: 1.6; }
.modal button {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 8px 24px;
  cursor: pointer;
  font-size: 14px;
}

/* Footer */
footer {
  text-align: center;
  padding: 24px 16px 40px;
  font-size: 12px;
  color: var(--text-light);
  line-height: 1.7;
}
footer .credit {
  margin-bottom: 12px;
}
footer .disclaimer {
  max-width: 640px;
  margin: 0 auto;
  padding: 12px 16px;
  background: rgba(255,255,255,0.6);
  border-radius: 8px;
  border: 1px solid var(--border);
}

/* Login page simple */
.login-box {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 28px 24px;
  max-width: 340px;
  margin: 40px auto;
  box-shadow: var(--shadow);
}
.login-box h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
.login-box input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
}
.login-box button {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
}
.hint { font-size: 12px; color: var(--text-light); text-align: center; margin-top: 12px; }

.hidden { display: none !important; }
</style>
</head>
<body>

<header onclick="renderList()" style="cursor:pointer;">
  <img class="logo" src="logo.png" alt="logo">
  <div>
    <div class="title">苗博</div>
    <div class="subtitle">演员谢苗超话</div>
  </div>
  <div class="right" id="authArea" onclick="event.stopPropagation()">
    <a href="#" onclick="showLogin()">登录</a>
  </div>
</header>

<main id="main">
  <!-- 首页列表会动态填充 -->
</main>

<footer>
  <div class="credit">制作：Kokoro | 林科森</div>
  <div class="disclaimer">
    ◆ 本站为谢苗粉丝向博客考古站，内容由粉丝整理与分享，非官方、非商业、不盈利。文章著作权归谢苗所有。请勿发布与本站无关或引起不适的内容。请自觉遵守互联网用语规范，不发敏感词、违禁词及其他违法违规信息。不适言论、不当内容与本站无关，用户承担其发言所带来的影响和法律责任。如有不当内容或侵权，请联系我们删除。感谢配合。 ◆
  </div>
</footer>

<!-- 初始化弹窗 -->
<div class="modal-overlay" id="initModal">
  <div class="modal">
    <h3>苗博</h3>
    <p>一次穿越时空的聚会<br>谢苗早年博客考古站<br><br>制作：Kokoro | 林科森<br><br>本站为粉丝向，非官方、不盈利，著作权归谢苗。如有侵权请联系删除。</p>
    <button onclick="closeInit()">开始阅读</button>
  </div>
</div>

<!-- 画线底部弹层 -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="sheet">
  <textarea id="highlightInput" placeholder="写下你对这段文字的评论..."></textarea>
  <div class="btns">
    <button class="cancel" onclick="closeSheet()">取消</button>
    <button class="submit" onclick="submitHighlight()">画线并评论</button>
  </div>
</div>

<script>
let posts = JSON.parse(localStorage.getItem('miaobo_posts') || 'null') || [
  {
    id: 1,
    title: "一次穿越时空的聚会！！！",
    date: "2009-01-14 18:27",
    excerpt: "11号在光线传媒举行了新老少林寺主创的联欢会~~ 两代“少林弟子”齐聚一堂，气氛其乐融融！",
    content: `<p>11号在光线传媒举行了新老少林寺主创的联欢会~~ 两代“少林弟子”齐聚一堂，气氛其乐融融！</p>
<p>对于电影《少林寺》我想没有人会感到陌生，那是中国电影的一个神话，也是功夫电影的一个标志。作为老电影《少林寺》的代表，演员计春华、于海、于承惠。导演张鑫炎以及主题曲《少林少林》的作曲家王立平老师等前辈悉数到场。</p>
<p>我感到这次机会的难得，更加体会到这次机会的珍贵！所以我们也尽自己的努力献上各式各样的节目~~ 值得一提的是我和李渊的“舞蹈”，颇费了我们一番心血... 迈克的舞蹈融合了中国的武术，我想这是我们这台节目的看点之一！</p>
<p>如果不是这次机缘，我想很难有机会能和这么多“少林”前辈们同台交流，兴奋之情无以言表！</p>
<p>看着与前辈们的一张张合影，给了我更多的信念与鼓励！感谢少林，让我们新老主创一同在神圣的舞台上体会百味人生；感谢前辈，让新一代的我们有了为之奋斗的动力；感谢观众，让掌声源源不断的作为我们身后支撑的无穷力量！让我们真诚祝愿：祝愿“少林之路”更加流光溢彩，更加璀璨辉煌！</p>`
  }
];

function savePosts() {
  localStorage.setItem('miaobo_posts', JSON.stringify(posts));
}

const admins = ['Kokoro', '林科森'];
let currentSort = 'newest';
let selectedText = '';
let currentUser = localStorage.getItem('miaobo_user') || null;
let editingId = null;

function isAdmin() {
  return currentUser && admins.includes(currentUser);
}

function renderList() {
  const sorted = [...posts].sort((a, b) => {
    if (currentSort === 'oldest') return new Date(a.date) - new Date(b.date);
    return new Date(b.date) - new Date(a.date);
  });
  document.getElementById('main').innerHTML = `
    <div class="sort-bar">
      <button class="${currentSort==='oldest'?'active':''}" onclick="setSort('oldest')">最早优先</button>
      <button class="${currentSort==='newest'?'active':''}" onclick="setSort('newest')">最新优先</button>
    </div>
    ${sorted.map(p => `
      <div class="article-card" onclick="showArticle(${p.id})">
        <div class="date">${p.date}</div>
        <h2>${p.title}</h2>
        <div class="excerpt">${p.excerpt}</div>
      </div>
    `).join('')}
  `;
  updateAuth();
}

function setSort(s) {
  currentSort = s;
  renderList();
}

function showArticle(id) {
  const p = posts.find(x => x.id === id);
  document.getElementById('main').innerHTML = `
    <div class="article-header">
      <h1>${p.title}</h1>
      <div class="meta">${p.date} ${isAdmin() ? `<a href="#" onclick="editArticle(${p.id});return false;" style="margin-left:12px;">编辑</a>` : ''}</div>
    </div>
    <div class="article-content" id="articleContent" onmouseup="onSelect()" ontouchend="onSelect()">
      ${p.content}
    </div>
    <div class="comments-section">
      <h3>评论</h3>
      <p style="color:var(--text-light);font-size:14px;">还没有评论，登录后可以画线或留言。</p>
    </div>
  `;
  updateAuth();
}

function editArticle(id) {
  const p = posts.find(x => x.id === id);
  editingId = id;
  document.getElementById('main').innerHTML = `
    <div class="article-header">
      <h1>编辑文章</h1>
    </div>
    <div class="login-box" style="max-width:100%;">
      <input id="editTitle" value="${p.title}" placeholder="标题" style="margin-bottom:12px;" />
      <input id="editDate" value="${p.date}" placeholder="时间" style="margin-bottom:12px;" />
      <textarea id="editContent" style="width:100%;height:300px;padding:12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:15px;margin-bottom:12px;">${p.content}</textarea>
      <div style="margin-bottom:12px;">
        <label style="font-size:14px;color:var(--text-light);">插入图片：</label>
        <input type="file" accept="image/*" onchange="insertImage(this)" />
      </div>
      <button onclick="saveArticle()">保存</button>
      <button onclick="showArticle(${id})" style="background:var(--border);color:var(--text);margin-left:8px;">取消</button>
    </div>
  `;
}

function insertImage(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const imgTag = `<p><img src="${e.target.result}" alt="图片"></p>`;
    const ta = document.getElementById('editContent');
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const before = ta.value.substring(0, start);
    const after = ta.value.substring(end);
    ta.value = before + '\n' + imgTag + '\n' + after;
    // 把光标移到插入内容后面
    const newPos = start + imgTag.length + 2;
    ta.focus();
    ta.setSelectionRange(newPos, newPos);
  };
  reader.readAsDataURL(file);
  input.value = ''; // 允许重复选同一张
}

function saveArticle() {
  const p = posts.find(x => x.id === editingId);
  p.title = document.getElementById('editTitle').value.trim();
  p.date = document.getElementById('editDate').value.trim();
  p.content = document.getElementById('editContent').value;
  p.excerpt = p.content.replace(/<[^>]+>/g, '').slice(0, 60) + '...';
  savePosts();
  showArticle(editingId);
}

function onSelect() {
  const sel = window.getSelection();
  const text = sel.toString().trim();
  if (text.length > 5 && currentUser) {
    selectedText = text;
    document.getElementById('overlay').style.display = 'block';
    document.getElementById('sheet').classList.add('show');
    document.getElementById('highlightInput').focus();
  }
}

function closeSheet() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('highlightInput').value = '';
  window.getSelection().removeAllRanges();
}

function submitHighlight() {
  const comment = document.getElementById('highlightInput').value.trim();
  if (!comment) return alert('请输入评论');
  // 简单模拟：在选中文字外包一层高亮
  const content = document.getElementById('articleContent');
  const html = content.innerHTML;
  if (html.includes(selectedText)) {
    content.innerHTML = html.replace(selectedText, `<span class="highlight" title="${comment}">${selectedText}</span>`);
  }
  closeSheet();
  alert('已画线（预览模式）');
}

function like(el) {
  const liked = el.classList.toggle('liked');
  const num = parseInt(el.textContent.replace(/\D/g,'')) || 0;
  el.textContent = (liked ? '♥ ' : '♡ ') + (liked ? num+1 : num-1);
}

function showLogin() {
  document.getElementById('main').innerHTML = `
    <div class="login-box">
      <h2 id="authTitle">登录</h2>
      <input id="username" placeholder="用户名" />
      <input id="password" type="password" placeholder="密码" />
      <button id="authBtn" onclick="doAuth()">登录</button>
      <div class="hint" id="authHint">
        还没有账号？<a href="#" onclick="switchToRegister()">去注册</a><br>
        管理员账号：Kokoro / 林科森
      </div>
    </div>
  `;
}

let isRegisterMode = false;

function switchToRegister() {
  isRegisterMode = true;
  document.getElementById('authTitle').textContent = '注册';
  document.getElementById('authBtn').textContent = '注册';
  document.getElementById('authBtn').onclick = doAuth;
  document.getElementById('authHint').innerHTML = '已有账号？<a href="#" onclick="switchToLogin()">去登录</a>';
}

function switchToLogin() {
  isRegisterMode = false;
  document.getElementById('authTitle').textContent = '登录';
  document.getElementById('authBtn').textContent = '登录';
  document.getElementById('authBtn').onclick = doAuth;
  document.getElementById('authHint').innerHTML = '还没有账号？<a href="#" onclick="switchToRegister()">去注册</a><br>管理员账号：Kokoro / 林科森';
}

function getUsers() {
  const raw = localStorage.getItem('miaobo_users');
  const users = raw ? JSON.parse(raw) : {};
  // 预置管理员
  if (!users['Kokoro']) users['Kokoro'] = 'admin';
  if (!users['林科森']) users['林科森'] = 'admin';
  return users;
}

function saveUsers(users) {
  localStorage.setItem('miaobo_users', JSON.stringify(users));
}

function doAuth() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (!u || !p) return alert('请输入用户名和密码');

  const users = getUsers();

  if (isRegisterMode) {
    if (users[u]) return alert('用户名已存在');
    users[u] = p;
    saveUsers(users);
    alert('注册成功，请登录');
    switchToLogin();
    document.getElementById('username').value = u;
    return;
  }

  // 登录
  if (!users[u] || users[u] !== p) return alert('用户名或密码错误');
  currentUser = u;
  localStorage.setItem('miaobo_user', u);
  renderList();
}

function updateAuth() {
  const area = document.getElementById('authArea');
  if (currentUser) {
    area.innerHTML = `<span>${currentUser}</span> <a href="#" onclick="logout()">退出</a>`;
  } else {
    area.innerHTML = `<a href="#" onclick="showLogin()">登录</a>`;
  }
}

function logout() {
  currentUser = null;
  localStorage.removeItem('miaobo_user');
  renderList();
}

function closeInit() {
  document.getElementById('initModal').style.display = 'none';
  localStorage.setItem('miaobo_init_seen', '1');
}

// Init
if (localStorage.getItem('miaobo_init_seen')) {
  document.getElementById('initModal').style.display = 'none';
}
renderList();
</script>
</body>
</html>
