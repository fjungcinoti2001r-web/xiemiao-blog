function editPost(){if(!isAdmin())return;hideSelectionMenu();editingPost=true;version++;editorRange=null;const p=posts.find(p=>same(p.id,curId))||{title:'',date:new Date().toISOString(),content:''};const draft=read('mb_editor_'+(curId??'new'),null);$('main').innerHTML=`<h2 style="margin-bottom:16px">${curId===null?'写文章':'编辑文章'}</h2><div class="box" style="max-width:100%;margin:0"><label>文章标题<input id="et" placeholder="填写标题"></label><label>原文日期<input id="ed" type="date"></label><div style="display:flex;align-items:center;gap:12px;margin:8px 0"><b>正文</b><button type="button" onclick="keepEditorSelection();$('ei').click()">＋ 从相册添加图片</button><input id="ei" type="file" accept="image/*" multiple hidden style="display:none!important" aria-label="选择文章图片"></div><div id="ec" class="content article-editor" contenteditable="true" role="textbox" aria-label="文章正文" aria-multiline="true" style="min-height:320px;max-height:65dvh;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere"></div><p style="font-size:12px;color:var(--light);margin:8px 0 16px">直接编辑文字和图片，发布后保持这里的排版。未发布内容自动保留在本机。</p><p id="publishMessage" role="status" style="font-size:14px;margin-bottom:12px"></p><button id="publishButton" onclick="savePost()">${curId===null?'发布文章':'保存修改'}</button> <button onclick="if(!writing){editingPost=false;curId===null?showList():showArticle(curId)}">返回</button></div>`;$('et').value=draft?.title??p.title;$('ed').value=draft?.date?.slice(0,10)??articleDate(p.date,false);$('ec').innerHTML=clean(draft?.content??p.content);$('ec').querySelectorAll('img').forEach(img=>img.style.maxWidth='100%');$('ec').oninput=saveEditorDraft;$('et').oninput=$('ed').oninput=saveEditorDraft;$('ec').onkeyup=$('ec').onmouseup=keepEditorSelection;$('ec').onpaste=e=>{e.preventDefault();keepEditorSelection();const image=[...e.clipboardData.files].find(f=>f.type.startsWith('image/'));if(image)return uploadEditorImage(image);const html=e.clipboardData.getData('text/html');insertEditorHTML(html||esc(e.clipboardData.getData('text/plain')).replace(/\n/g,'<br>'))};$('ei').onchange=async()=>{const files=[...$('ei').files];$('ei').value='';for(const file of files)await uploadEditorImage(file)};if(draft)$('publishMessage').textContent='已恢复上次未发布的草稿。'}
async function savePost(){if(!isAdmin()||writing||!needAuth())return;const title=$('et').value.trim(),date=new Date($('ed').value+'T00:00:00+08:00'),content=clean($('ec').innerHTML),div=document.createElement('div');div.innerHTML=content;if(!title||isNaN(date)||(!div.textContent.trim()&&!div.querySelector('img')))return $('publishMessage').textContent='请填写标题、时间和正文。';saveEditorDraft();const oldId=curId,button=$('publishButton');writing=true;button.disabled=true;button.textContent='正在保存…';$('publishMessage').textContent='正在上传文章，请稍候…';try{const payload={title,content,excerpt:div.textContent.slice(0,100),published_at:date.toISOString(),updated_at:new Date().toISOString()},q=oldId===null?sb.from('posts').insert(payload):sb.from('posts').update(payload).eq('id',oldId);const row=await query(q.select().single()),p={...row,date:row.published_at};posts=oldId===null?[...posts,p]:posts.map(x=>same(x.id,oldId)?p:x);store('mb_v2_posts',JSON.stringify(posts));store('mb_editor_'+(oldId??'new'),'null');curId=row.id;editingPost=false;notice(oldId===null?'文章发布成功':'修改已保存');await showArticle(row.id)}catch(e){if($('publishMessage'))$('publishMessage').textContent='保存未完成：'+e.message+'。草稿已保留。'}finally{writing=false;if(button.isConnected){button.disabled=false;button.textContent=oldId===null?'发布文章':'保存修改'}}}

let authBusy=false;
function authMessage(text,kind='error'){const el=$('authMessage');if(el){el.textContent=text;el.style.color=kind==='error'?'#a33128':kind==='success'?'#367246':'#795b3e'}else notice(text)}
function showLogin(){if(authBusy)return;hideSelectionMenu();curId=null;version++;$('main').innerHTML=`<form class="box" novalidate onsubmit="event.preventDefault();doAuth()"><h2>${reg?'注册':'登录'}</h2><label>用户名<input id="un" required maxlength="40" autocomplete="username"></label><label>密码<input id="pw" required type="password" autocomplete="${reg?'new-password':'current-password'}"></label><p id="authMessage" role="status" aria-live="polite" style="font-size:14px;white-space:pre-wrap;margin-bottom:12px"></p><button id="authSubmit" type="submit">${reg?'注册':'登录'}</button><p><a href="#" onclick="if(!authBusy){reg=!reg;showLogin()}return false">${reg?'已有账号？登录':'注册账号'}</a></p></form>`}
function authError(e){const m=e?.message||String(e);if(/Invalid login credentials/i.test(m))return '用户名或密码不正确；请确认已经注册云端账号。';if(/Email not confirmed/i.test(m))return '账号邮箱尚未验证。当前用户名使用虚拟邮箱，无法接收验证邮件，需要管理员检查 Supabase 邮箱确认配置。';if(/invalid.*email|email.*invalid/i.test(m))return '云端不接受当前虚拟邮箱：'+m;if(/Database error saving new user/i.test(m))return '账号创建时数据库报错，请检查 Auth 日志和 profiles 注册触发器。原始错误：'+m;if(/fetch|network|timeout|连接超时/i.test(m))return '连接云端超时或网络失败，暂时无法确认操作结果。请先到 Supabase Users 查看是否已创建账号，再重试登录。';if(/already registered/i.test(m))return '账号已经注册，请切换登录。';return '云端返回：'+m}

function emailFor(u){return /^[\x21-\x7e]+$/.test(u)?u.toLowerCase()+'@miaobo.local':Array.from(new TextEncoder().encode(u)).map(b=>b.toString(16).padStart(2,'0')).join('')+'@miaobo.local'}
async function doAuth(){if(authBusy)return;if(!sb)return authMessage('登录服务未加载，可能是 CDN 网络失败，请刷新页面后重试。');const u=$('un').value.trim().normalize('NFC'),password=$('pw').value;if(!u||!password)return authMessage('请填写用户名和密码。');if(u.length>40)return authMessage('用户名最多 40 个字符。');if(reg&&password.length<6)return authMessage('注册密码至少 6 位，请设置新密码；admin 是旧版本地密码。');const registering=reg,button=$('authSubmit');authBusy=true;button.disabled=true;button.textContent=registering?'正在注册…':'正在登录…';authMessage(registering?'正在连接云端并创建账号…':'正在验证云端账号…','progress');try{const r=await bounded(registering?sb.auth.signUp({email:emailFor(u),password,options:{data:{username:u}}}):sb.auth.signInWithPassword({email:emailFor(u),password}));if(r.error)throw r.error;if(!r.data?.session){authMessage(registering?'注册请求已返回，但未获得登录会话。请到 Supabase → Authentication → Users 确认账号是否创建；若需要邮箱确认，虚拟邮箱无法收信，请管理员检查确认设置。':'云端未返回登录会话，请重试。','error');return}session=r.data.session;user=session.user.user_metadata?.username||u;profile=null;let warning='';try{profile=await query(sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle());if(profile)user=profile.username;else warning='账号资料未创建，请检查 profiles 注册触发器。'}catch(e){warning='账号已登录，但资料读取失败：'+e.message}authUI();showList();status((registering?'注册成功，已登录':'登录成功')+' · '+user+(warning?' · '+warning:''));notice(registering?'注册成功，已登录':'登录成功')}catch(e){authMessage(authError(e))}finally{authBusy=false;if(button.isConnected){button.disabled=false;button.textContent=registering?'注册':'登录'}}}

async function logout(){try{const r=await bounded(sb.auth.signOut());if(r.error)throw r.error;session=profile=user=null;authUI();showList()}catch(e){notice('退出失败：'+e.message)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
if(read('miaobo_seen',false))$('initModal').style.display='none';
showList();if(sb){refreshAuth().then(()=>{if(curId)showArticle(curId)}).catch(e=>notice('登录状态读取失败：'+e.message));sb.auth.onAuthStateChange(()=>{setTimeout(()=>refreshAuth().catch(()=>{}),0)})}

</script>
