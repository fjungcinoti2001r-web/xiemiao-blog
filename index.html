<title>苗博</title>

<style>
:root{--bg:#faf6f1;--card:#fff;--text:#3a3530;--light:#8a8075;--accent:#d4a574;--warm:#e8c4a0;--hl:#f5e6d3;--border:#ebe4db;--shadow:0 2px 12px rgba(180,140,100,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:16px}
a{color:var(--accent);text-decoration:none}
header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;cursor:pointer}
header img{width:40px;height:40px;border-radius:50%;object-fit:cover}
header .title{font-size:20px;font-weight:600}
header .sub{font-size:12px;color:var(--light)}
header .right{margin-left:auto;font-size:14px}
main{max-width:680px;margin:0 auto;padding:20px 16px 100px}
.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sort-bar button,.filter-btn{background:none;border:1px solid var(--border);border-radius:16px;padding:4px 12px;color:var(--light);cursor:pointer;font-size:13px}
.sort-bar button.active{background:var(--warm);color:var(--text);border-color:var(--accent)}
.filter-panel{background:var(--card);border-radius:12px;padding:12px;margin-bottom:16px;box-shadow:var(--shadow);display:none}
.filter-panel.show{display:block}
.filter-panel .year{font-weight:600;margin:8px 0 4px;cursor:pointer}
.filter-panel .months{display:flex;flex-wrap:wrap;gap:6px}
.filter-panel .months span{background:var(--bg);border-radius:12px;padding:2px 10px;font-size:12px;cursor:pointer}
.filter-panel .months span.active{background:var(--warm)}
.card{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer}
.card .date{font-size:12px;color:var(--light);margin-bottom:6px}
.card h2{font-size:18px;margin-bottom:6px}
.excerpt{font-size:14px;color:#666;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.content{background:var(--card);border-radius:12px;padding:24px 20px;box-shadow:var(--shadow);margin-bottom:24px}
.content p{margin-bottom:16px}
.content img{max-width:100%;border-radius:8px;margin:12px 0}
.highlight{background:var(--hl);border-bottom:2px solid var(--accent);cursor:pointer;border-radius:2px;padding:0 2px}
.comment{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.comment .floor{font-size:12px;color:var(--light)}
.comment .user{font-weight:600;font-size:14px}
.comment .time{font-size:12px;color:var(--light);margin-left:8px}
.comment .text{margin:8px 0}
.comment .actions{font-size:13px;color:var(--light)}
.comment .actions span{cursor:pointer;margin-right:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;padding:20px;z-index:201;transform:translateY(100%);transition:.25s}
.sheet.show{transform:translateY(0)}
.sheet textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;height:80px;font-family:inherit}
.sheet .btns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.sheet button{padding:8px 16px;border-radius:20px;border:none;cursor:pointer}
.sheet .cancel{background:var(--border)}
.sheet .ok{background:var(--accent);color:#fff}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border-radius:16px;padding:28px 24px;max-width:320px;text-align:center}
.modal button{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:10px 28px;cursor:pointer;margin-top:12px}
.box{background:var(--card);border-radius:12px;padding:28px 24px;max-width:360px;margin:40px auto;box-shadow:var(--shadow)}
.box input,.box textarea{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit}
.box button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer}
footer{text-align:center;padding:24px 16px 40px;font-size:12px;color:var(--light)}
footer .dis{max-width:640px;margin:12px auto 0;padding:12px 16px;background:rgba(255,255,255,.6);border-radius:8px;border:1px solid var(--border);line-height:1.7}
button,a,input,textarea{touch-action:manipulation}button{font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:3px solid #b8783d;outline-offset:3px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.content{overflow-wrap:anywhere}.sheet{max-height:85dvh;overflow:auto;padding-bottom:max(20px,env(safe-area-inset-bottom))}#status{max-width:680px;margin:12px auto;padding:0 16px;font-size:13px;color:#795b3e}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:600;background:#3a3530;color:white;padding:12px 20px;border-radius:12px;max-width:92vw}h1{line-height:1.5}.box{width:100%}.modal-overlay{padding:16px}.card:hover{box-shadow:0 4px 18px #b48c6425}@media(max-width:400px){header{padding:12px}.sheet .btns{flex-wrap:wrap}}</style>
</head>

<script>const SEED=[{
  id:1, title:"一次穿越时空的聚会！！！", date:"2009-01-14 18:27",
  excerpt:"11号在光线传媒举行了新老少林寺主创的联欢会~~ 两代“少林弟子”齐聚一堂，气氛其乐融融！",
  content:`<p>11号在光线传媒举行了新老少林寺主创的联欢会~~ 两代“少林弟子”齐聚一堂，气氛其乐融融！</p><p>对于电影《少林寺》我想没有人会感到陌生，那是中国电影的一个神话，也是功夫电影的一个标志。作为老电影《少林寺》的代表，演员计春华、于海、于承惠。导演张鑫炎以及主题曲《少林少林》的作曲家王立平老师等前辈悉数到场。</p><p>我感到这次机会的难得，更加体会到这次机会的珍贵！所以我们也尽自己的努力献上各式各样的节目~~ 值得一提的是我和李渊的“舞蹈”，颇费了我们一番心血... 迈克的舞蹈融合了中国的武术，我想这是我们这台节目的看点之一！</p><p>如果不是这次机缘，我想很难有机会能和这么多“少林”前辈们同台交流，兴奋之情无以言表！</p><p>看着与前辈们的一张张合影，给了我更多的信念与鼓励！感谢少林，让我们新老主创一同在神圣的舞台上体会百味人生；感谢前辈，让新一代的我们有了为之奋斗的动力；感谢观众，让掌声源源不断的作为我们身后支撑的无穷力量！让我们真诚祝愿：祝愿“少林之路”更加流光溢彩，更加璀璨辉煌！</p>`
}];
const FIRST_ARTICLE={"title":"一次穿越时空的聚会！！！","published_at":"2009-01-14T18:27:00+08:00","excerpt":"11号在光线传媒举行了新老少林寺主创的联欢会~~ 两代“少林弟子”齐聚一堂，气氛其乐融融！","content":"<p>11号在光线传媒举行了新老少林寺主创的联欢会~~ 两代“少林弟子”齐聚一堂，气氛其乐融融！</p><p>对于电影《少林寺》我想没有人会感到陌生，那是中国电影的一个神话，也是功夫电影的一个标志。作为老电影《少林寺》的代表，演员计春华、于海、于承惠。导演张鑫炎以及主题曲《少林少林》的作曲家王立平老师等前辈悉数到场。</p><p>我感到这次机会的难得，更加体会到这次机会的珍贵！所以我们也尽自己的努力献上各式各样的节目~~ 值得一提的是我和李渊的“舞蹈”，颇费了我们一番心血... 迈克的舞蹈融合了中国的武术，我想这是我们这台节目的看点之一！</p><p>如果不是这次机缘，我想很难有机会能和这么多“少林”前辈们同台交流，兴奋之情无以言表！</p><p><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgEAtAC0AAD/4RbMRXhpZgAASUkqAAgAAAAKAA8BAgAGAAAAhgAAABABAgAaAAAAjAAAABIBAwABAAAAAQAAABoBBQABAAAApgAAABsBBQABAAAArgAAACgBAwABAAAAAgAAADEBAgAcAAAAtgAAADIBAgAUAAAA0gAAABMCAwABAAAAAQAAAGmHBAABAAAA6AAAACQEAABDYW5vbgBDYW5vbiBESUdJVEFMIElYVVMgODYwIElTAEB3GwAQJwAAQHcbABAnAABBZG9iZSBQaG90b3Nob3AgQ1MyIFdpbmRvd3MAMjAwOTowMToxMyAyMDo1NTo0MAAAAB8AmoIFAAEAAABiAgAAnYIFAAEAAABqAgAAJ4gDAAEAAAD6AAAAAJAHAAQAAAAwMjIwA5ACABQAAAByAgAABJACABQAAACGAgAAAZEHAAQAAAABAgMAApEFAAEAAACaAgAAAZIKAAEAAACiAgAAApIFAAEAAACqAgAABJIKAAEAAACyAgAABZIFAAEAAAC6AgAAB5IDAAEAAAAFAAAACZIDAAEAAABZAAAACpIFAAEAAADCAgAAhpIHAAgBAADKAgAAAKAHAAQAAAAwMTAwAaADAAEAAAABAAAAAqAEAAEAAAD0AQAAA6AEAAEAAABHAQAABaAEAAEAAADsAwAADqIFAAEAAADSAwAAD6IFAAEAAADaAwAAEKIDAAEAAAACAAAAF6IDAAEAAAACAAAAAKMHAAEAAAADAAAAAaQDAAEAAAAAAAAAAqQDAAEAAAAAAAAAA6QDAAEAAAAAAAAABKQFAAEAAADiAwAABqQDAAEAAAACAAAAAAAAAAEAAAA8AAAAIwAAAAoAAAAyMDA5OjAxOjExIDIyOjA4OjA5ADIwMDk6MDE6MTEgMjI6MDg6MDkABQAAAAEAAAC9AAAAIAAAAHQAAAAgAAAAAAAAAAMAAAB0AAAAIAAAAIwdAADoAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAM4xAOEAAACAWiUAqQAAAMAMAADADAAAAAAEAAEAAgAEAAAAUjk4AAIABwAEAAAAMDEwMAEQAwABAAAAwAwAAAIQAwABAAAAkAkAAAAAAAAAAAYAAwEDAAEAAAAGAAAAGgEFAAEAAA function authUI(){$('auth').replaceChildren();if(user){$('auth').append(document.createTextNode(user+' '));const b=document.createElement('button');b.textContent='退出';b.onclick=logout;$('auth').append(b)}else{$('auth').innerHTML='<a href="#" onclick="showLogin();return false">登录</a>'}}
async function refreshAuth(){session=(await bounded(sb.auth.getSession())).data.session;user=null;profile=null;if(session){profile=(await query(sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle()));user=profile?.username||session.user.user_metadata.username||'读者'}authUI();if(curId===null&&!editingPost&& !$('authSubmit'))renderList()}
function showList(){editingPost=false;curId=null;version++;renderList();loadPosts()}
async function loadPosts(){const v=version;if(!sb){status('离线阅读 · 当前内容来自本机缓存');return}try{const data=await query(sb.from('posts').select('*').order('published_at'));if(v!==version)return;posts=data.map(p=>({...p,date:p.published_at}));store('mb_v2_posts',JSON.stringify(posts));status(data.length?'已连接云端':'云端暂无文章，管理员登录后可发布文章');renderList()}catch(e){if(v===version)status('离线阅读 · '+e.message+' · 显示本机缓存')}}
function renderList(){authUI();const ym={};for(const p of posts){const d=new Date(p.date);if(!isNaN(d)){(ym[d.getFullYear()]??=new Set()).add(d.getMonth()+1)}}let list=posts.filter(p=>!filter||(new Date(p.date).getFullYear()===filter.y&&(!filter.m||new Date(p.date).getMonth()+1===filter.m)));list.sort((a,b)=>(new Date(a.date)-new Date(b.date))*(sort==='oldest'?1:-1));$('main').innerHTML=`${isAdmin()?'<div style="margin-bottom:16px"><button onclick="newPost()">＋ 发布文章</button> <button onclick="importFirstPost()">导入第一篇文章</button></div>':''}<div class="sort-bar"><button onclick="$('fp').classList.toggle('show')">${filter?filter.y+'年'+(filter.m?filter.m+'月':''):'全部时间'}</button><div><button class="${sort==='oldest'?'active':''}" onclick="sort='oldest';renderList()">最早优先</button> <button class="${sort==='newest'?'active':''}" onclick="sort='newest';renderList()">最新优先</button></div></div><div id="fp" class="filter-panel"><button onclick="filter=null;renderList()">全部时间</button>${Object.keys(ym).reverse().map(y=>`<div class="year" onclick="filter={y:${y}};renderList()">${y}年</div><div class="months">${[...ym[y]].sort((a,b)=>a-b).map(m=>`<span onclick="filter={y:${y},m:${m}};renderList()">${m}月</span>`).join('')}</div>`).join('')}</div>${list.map(p=>`<article class="card" tabindex="0" role="button" onclick="showArticle('${esc(p.id)}')" onkeydown="if(event.key==='Enter')this.click()"><div class="date">${esc(p.date)}</div><h2>${esc(p.title)}</h2><div class="excerpt">${esc(p.excerpt)}</div></article>`).join('')||'<p>暂无文章</p>'}`}
async function showArticle(id){curId=id;const v=++version;const p=posts.find(p=>same(p.id,id));if(!p)return showList();comments=read('mb_v2_comments_'+id,[]);highlights=read('mb_v2_highlights_'+id,[]);renderArticle(p);if(!sb)return;try{const data=await Promise.all([query(sb.from('comments').select('*').eq('post_id',id).order('created_at')),query(sb.from('highlights').select('*').eq('post_id',id).order('created_at')),query(sb.from('profiles').select('id,username')),query(sb.from('likes').select('*'))]);if(v!==version)return;[comments,highlights,profiles,likes]=data;store('mb_v2_comments_'+id,JSON.stringify(comments));store('mb_v2_highlights_'+id,JSON.stringify(highlights));status('已连接云端');renderArticle(p)}catch(e){if(v===version)status('评论读取失败 · '+e.message+' · 显示缓存')}}
const name=id=>profiles.find(p=>p.id===id)?.username||'读者';
const count=(type,id)=>likes.filter(l=>l.target_type===type&&same(l.target_id,id)).length;
function renderArticle(p){$('main').innerHTML=`<a href="#" onclick="showList();return false">← 返回</a><h1>${esc(p.title)}</h1><p>${esc(p.date)} ${isAdmin()?'<button onclick="editPost()">编辑</button>':''}</p><div class="content" id="ac">${clean(p.content)}</div><h3>评论 · ${comments.length}</h3>${comments.map((c,i)=>`<div class="comment"><div class="floor">${i+1}楼 · ${esc(new Date(c.created_at).toLocaleString('zh-CN'))}</div><b>${esc(name(c.user_id))}</b>${c.parent_id?`<p>回复 ${esc(name(comments.find(x=>same(x.id,c.parent_id))?.user_id))}</p>`:''}<div class="text">${esc(c.content)}</div><button onclick="toggleLike('comment','${c.id}')">♡ ${count('comment',c.id)}</button> <button onclick="replyC('${c.id}')">回复</button>${isAdmin()?` <button onclick="removeEntry('comments','${c.id}')">删除</button>`:''}</div>`).join('')||'<p>还没有评论</p>'}<div class="box"><textarea id="nc" maxlength="4000" placeholder="写下评论…（登录后发表）"></textarea><button onclick="addC()">发表</button><p style="font-size:12px">${esc(read('mb_draft_'+curId,'')?'已恢复本机草稿':'选中正文可画线评论或生成书摘')}</p></div>`;$('nc').value=read('mb_draft_'+curId,'');$('nc').oninput=()=>store('mb_draft_'+curId,JSON.stringify($('nc').value));paintHighlights();$('ac').onpointerup=()=>setTimeout(selectText,80);authUI()}
function selectText(){const s=getSelection();if(!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0);if(!$('ac').contains(r.commonAncestorContainer))return;selText=s.toString();if(!selText.trim())return;const before=r.cloneRange();before.selectNodeContents($('ac'));before.setEnd(r.startContainer,r.startOffset);selectionStart=before.toString().length;$('overlay').style.display='block';$('sheet').classList.add('show');$('hlInput').focus()}
function paintHighlights(){const root=$('ac'),walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];let n,offset=0;while(n=walker.nextNode()){nodes.push({n,start:offset});offset+=n.length}const text=root.textContent;const spans=highlights.map(h=>{const start=h.start_offset??text.indexOf(h.selected_text);return {h,start,end:start+h.selected_text.length}}).filter(x=>x.start>=0);for(const {n,start} of nodes){const cuts=new Set([0,n.length]);for(const s of spans){if(s.start<start+n.length&&s.end>start){cuts.add(Math.max(0,s.start-start));cuts.add(Math.min(n.length,s.end-start))}}const points=[...cuts].sort((a,b)=>a-b),frag=document.createDocumentFragment();for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1],s=spans.find(x=>x.start<=start+a&&x.end>=start+b);const el=document.createElement(s?'mark':'span');el.textContent=n.data.slice(a,b);if(s){el.className='highlight';el.onclick=()=>showHLComments(s.h.selected_text)}frag.append(el)}n.replaceWith(frag)}}
function needAuth(){if(session)return true;notice('请先登录云端账号');return false}
let writing=false;
async function write(action){if(writing||!needAuth())return;writing=true;try{await action();notice('已保存到云端');await showArticle(curId)}catch(e){notice('保存失败：'+e.message+'。草稿保留在本机，可重试')}finally{writing=false}}
function addC(parent=null,text=null){const content=text??$('nc').value.trim();if(!content)return;write(async()=>{await query(sb.from('comments').insert({post_id:curId,user_id:session.user.id,content,parent_id:parent}).select().single());store('mb_draft_'+curId,JSON.stringify(''))})}
function replyC(id){if(!needAuth())return;const c=comments.find(c=>same(c.id,id)),t=prompt('回复 '+name(c.user_id)+'：');if(t?.trim()){$('nc').value=t;store('mb_draft_'+curId,JSON.stringify(t));addC(id,t.trim())}}
function addHighlight(){const comment=$('hlInput').value.trim();if(!comment||!selText)return;store('mb_highlight_draft',JSON.stringify({postId:curId,text:selText,comment,start:selectionStart}));write(async()=>{await query(sb.from('highlights').insert({post_id:curId,user_id:session.user.id,selected_text:selText,comment,start_offset:selectionStart}).select().single());store('mb_highlight_draft','null');closeSheet()})}
function toggleLike(type,id){write(async()=>{const l=likes.find(l=>l.user_id===session.user.id&&l.target_type===type&&same(l.target_id,id));await query(l?sb.from('likes').delete().eq('id',l.id):sb.from('likes').insert({user_id:session.user.id,target_type:type,target_id:id}))})}
function removeEntry(table,id){if(isAdmin()&&confirm('删除这条评论？'))write(()=>query(sb.from(table).delete().eq('id',id)))}
function showHLComments(text){const overlay=document.createElement('div');overlay.className='modal-overlay';const box=document.createElement('div');box.className='modal';box.style.cssText='max-height:80dvh;overflow:auto;max-width:480px';const quote=document.createElement('blockquote');quote.textContent=text;box.append(quote);for(const h of highlights.filter(h=>h.selected_text===text)){const p=document.createElement('p');p.textContent=name(h.user_id)+'：'+h.comment;const b=document.createElement('button');b.textContent='♡ '+count('highlight',h.id);b.onclick=()=>{overlay.remove();toggleLike('highlight',h.id)};box.append(p,b);if(isAdmin()){const del=document.createElement('button');del.textContent='删除';del.onclick=()=>{overlay.remove();removeEntry('highlights',h.id)};box.append(del)}}const close=document.createElement('button');close.textContent='关闭';close.onclick=()=>overlay.remove();box.append(close);overlay.append(box);document.body.append(overlay)}
function closeSheet(){$('overlay').style.display='none';$('sheet').classList.remove('show');$('hlInput').value=''}
async function makeExcerpt(){if(!selText)return;await document.fonts.ready;const p=posts.find(p=>same(p.id,curId)),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');const wrap=(text,max)=>{const lines=[];for(const paragraph of text.split('\n')){let line='';for(const c of paragraph){if(ctx.measureText(line+c).width>max&&line){lines.push(line);line=''}line+=c}lines.push(line)}return lines};ctx.font='28px "Microsoft YaHei",sans-serif';const lines=wrap(selText,540);if(lines.length>150)return notice('选文过长，请分段生成书摘');const titles=wrap(p.title,540);canvas.width=660;canvas.height=220+lines.length*48+titles.length*40;ctx.fillStyle='#faf6f1';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#3a3530';ctx.font='28px "Microsoft YaHei",sans-serif';lines.forEach((l,i)=>ctx.fillText(l,60,80+i*48));let y=110+lines.length*48;ctx.fillStyle='#8a8075';ctx.font='24px "Microsoft YaHei",sans-serif';titles.forEach(l=>{ctx.fillText(l,60,y);y+=40});ctx.font='20px sans-serif';ctx.fillText('苗博 · 著作权归谢苗',60,y+24);canvas.toBlob(blob=>{if(!blob)return notice('图片生成失败');const url=URL.createObjectURL(blob),overlay=document.createElement('div');overlay.className='modal-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','书摘预览');overlay.setAttribute('aria-modal','true');overlay.style.cssText='padding:24px;background:rgba(0,0,0,.58);backdrop-filter:blur(3px)';const box=document.createElement('div');box.style.cssText='width:min(100%,320px);text-align:center;position:relative';const img=new Image();img.src=url;img.alt='书摘图片，长按保存';img.style.cssText='display:block;width:100%;max-height:68dvh;object-fit:contain;border-radius:5px;box-shadow:0 12px 40px #0003';const b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label','关闭书摘');b.style.cssText='display:block;margin:18px auto 0;width:36px;height:36px;border:1px solid #ffffff70;border-radius:50%;background:transparent;color:white;font-size:26px;line-height:30px;padding:0';const previous=document.activeElement;const close=()=>{overlay.remove();URL.revokeObjectURL(url);document.removeEventListener('keydown',onKey);if(previous?.isConnected)previous.focus()};const onKey=e=>{if(e.key==='Escape'){e.stopImmediatePropagation();close()}if(e.key==='Tab'){e.preventDefault();b.focus()}};b.onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};document.addEventListener('keydown',onKey);const tip=document.createElement('p');tip.textContent='长按图片保存';tip.style.cssText='margin:14px 0 0;color:#ffffffb3;font-size:12px;letter-spacing:1px';box.append(img,tip,b);overlay.append(box);document.body.append(overlay);b.focus()},'image/png');closeSheet()}
function newPost(){if(!isAdmin())return;curId=null;editPost()}
function editPost(){if(!isAdmin())return;editingPost=true;version++;const p=posts.find(p=>same(p.id,curId))||{title:'',date:new Date().toISOString(),content:''};$('main').innerHTML='<h2>'+ (curId===null?'发布文章':'编辑文章') +'</h2><div class="box"><label>标题<input id="et"></label><label>发布时间<input id="ed" type="datetime-local"></label><label>正文 HTML<textarea id="ec" style="height:300px"></textarea></label><input id="ei" type="file" accept="image/*"><button onclick="savePost()">保存到云端</button> <button onclick="editingPost=false;curId===null?showList():showArticle(curId)">取消</button></div>';$('et').value=p.title;$('ed').value=new Date(new Date(p.date)-new Date(p.date).getTimezoneOffset()*60000).toISOString().slice(0,16);$('ec').value=p.content;$('ei').onchange=()=>{const f=$('ei').files[0];if(!f)return;if(f.size>1500000)return notice('请使用小于 1.5 MB 的图片');const r=new FileReader();r.onload=()=>{$('ec').setRangeText('<p><img src="'+r.result+'" alt="文章配图"></p>',$('ec').selectionStart,$('ec').selectionEnd,'end')};r.readAsDataURL(f)}}
function savePost(){if(!isAdmin())return;const title=$('et').value.trim(),date=new Date($('ed').value),raw=$('ec').value;const content=clean(/<\/?[a-z][\s\S]*>/i.test(raw)?raw:raw.split(/\n\s*\n/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join(''));if(!title||isNaN(date)||!content.trim())return notice('请填写标题、有效时间和正文');const div=document.createElement('div');div.innerHTML=content;const oldId=curId;write(async()=>{const payload={title,content,excerpt:div.textContent.slice(0,100),published_at:date.toISOString(),updated_at:new Date().toISOString()};const q=oldId===null?sb.from('posts').insert(payload):sb.from('posts').update(payload).eq('id',oldId);const row=await query(q.select().single());const p={...row,date:row.published_at};posts=oldId===null?[...posts,p]:posts.map(x=>same(x.id,oldId)?p:x);curId=row.id;editingPost=false;store('mb_v2_posts',JSON.stringify(posts))})}
let authBusy=false;
function authMessage(text,kind='error'){const el=$('authMessage');if(el){el.textContent=text;el.style.color=kind==='error'?'#a33128':kind==='success'?'#367246':'#795b3e'}else notice(text)}
function showLogin(){if(authBusy)return;curId=null;version++;$('main').innerHTML=`<form class="box" novalidate onsubmit="event.preventDefault();doAuth()"><h2>${reg?'注册':'登录'}</h2><label>用户名<input id="un" required maxlength="40" autocomplete="username"></label><label>密码<input id="pw" required type="password" autocomplete="${reg?'new-password':'current-password'}"></label><p id="authMessage" role="status" aria-live="polite" style="font-size:14px;white-space:pre-wrap;margin-bottom:12px"></p><button id="authSubmit" type="submit">${reg?'注册':'登录'}</button><p><a href="#" onclick="if(!authBusy){reg=!reg;showLogin()}return false">${reg?'已有账号？登录':'注册账号'}</a></p></form>`}
function authError(e){const m=e?.message||String(e);if(/Invalid login credentials/i.test(m))return '用户名或密码不正确；请确认已经注册云端账号。';if(/Email not confirmed/i.test(m))return '账号邮箱尚未验证。当前用户名使用虚拟邮箱，无法接收验证邮件，需要管理员检查 Supabase 邮箱确认配置。';if(/invalid.*email|email.*invalid/i.test(m))return '云端不接受当前虚拟邮箱：'+m;if(/Database error saving new user/i.test(m))return '账号创建时数据库报错，请检查 Auth 日志和 profiles 注册触发器。原始错误：'+m;if(/fetch|network|timeout|连接超时/i.test(m))return '连接云端超时或网络失败，暂时无法确认操作结果。请先到 Supabase Users 查看是否已创建账号，再重试登录。';if(/already registered/i.test(m))return '账号已经注册，请切换登录。';return '云端返回：'+m}

function emailFor(u){return /^[\x21-\x7e]+$/.test(u)?u.toLowerCase()+'@miaobo.local':Array.from(new TextEncoder().encode(u)).map(b=>b.toString(16).padStart(2,'0')).join('')+'@miaobo.local'}
async function doAuth(){if(authBusy)return;if(!sb)return authMessage('登录服务未加载，可能是 CDN 网络失败，请刷新页面后重试。');const u=$('un').value.trim().normalize('NFC'),password=$('pw').value;if(!u||!password)return authMessage('请填写用户名和密码。');if(u.length>40)return authMessage('用户名最多 40 个字符。');if(reg&&password.length<6)return authMessage('注册密码至少 6 位，请设置新密码；admin 是旧版本地密码。');const registering=reg,button=$('authSubmit');authBusy=true;button.disabled=true;button.textContent=registering?'正在注册…':'正在登录…';authMessage(registering?'正在连接云端并创建账号…':'正在验证云端账号…','progress');try{const r=await bounded(registering?sb.auth.signUp({email:emailFor(u),password,options:{data:{username:u}}}):sb.auth.signInWithPassword({email:emailFor(u),password}));if(r.error)throw r.error;if(!r.data?.session){authMessage(registering?'注册请求已返回，但未获得登录会话。请到 Supabase → Authentication → Users 确认账号是否创建；若需要邮箱确认，虚拟邮箱无法收信，请管理员检查确认设置。':'云端未返回登录会话，请重试。','error');return}session=r.data.session;user=session.user.user_metadata?.username||u;profile=null;let warning='';try{profile=await query(sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle());if(profile)user=profile.username;else warning='账号资料未创建，请检查 profiles 注册触发器。'}catch(e){warning='账号已登录，但资料读取失败：'+e.message}authUI();showList();status((registering?'注册成功，已登录':'登录成功')+' · '+user+(warning?' · '+warning:''));notice(registering?'注册成功，已登录':'登录成功')}catch(e){authMessage(authError(e))}finally{authBusy=false;if(button.isConnected){button.disabled=false;button.textContent=registering?'注册':'登录'}}}

async function logout(){try{const r=await bounded(sb.auth.signOut());if(r.error)throw r.error;session=profile=user=null;authUI();showList()}catch(e){notice('退出失败：'+e.message)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
if(read('miaobo_seen',false))$('initModal').style.display='none';
showList();if(sb){refreshAuth().then(()=>{if(curId)showArticle(curId)}).catch(e=>notice('登录状态读取失败：'+e.message));sb.auth.onAuthStateChange(()=>{setTimeout(()=>refreshAuth().catch(()=>{}),0)})}

async function importFirstPost(){if(!isAdmin()||!needAuth())return;if(writing)return;writing=true;const v=++version;status('正在导入第一篇文章…');try{const existing=await query(sb.from('posts').select('*').eq('title',FIRST_ARTICLE.title).eq('published_at',FIRST_ARTICLE.published_at));if(existing.length){if(!posts.some(p=>same(p.id,existing[0].id)))posts.push({...existing[0],date:existing[0].published_at});notice('文章已存在，未重复导入');await showArticle(existing[0].id);return}const row=await query(sb.from('posts').insert(FIRST_ARTICLE).select().single());posts.push({...row,date:row.published_at});store('mb_v2_posts',JSON.stringify(posts));notice('第一篇文章已导入云端');await showArticle(row.id)}catch(e){status('导入未完成：'+e.message);notice('导入失败，请检查管理员权限和 RLS，再重试')}finally{writing=false}}
</script>
