<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苗博</title>
<style>
:root {
  --bg: #faf6f1;
  --bg-card: #ffffff;
  --text: #3a3530;
  --text-light: #8a8075;
  --accent: #d4a574;
  --accent-warm: #e8c4a0;
  --highlight: #f5e6d3;
  --border: #ebe4db;
  --shadow: 0 2px 12px rgba(180, 140, 100, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-size: 16px;
}
a { color: var(--accent); text-decoration: none; }
header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  cursor: pointer;
}
header img.logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
header .title { font-size: 20px; font-weight: 600; }
header .subtitle { font-size: 12px; color: var(--text-light); }
header .right { margin-left: auto; font-size: 14px; color: var(--text-light); }
main { max-width: 680px; margin: 0 auto; padding: 20px 16px 100px; }
.sort-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 16px; font-size: 13px; }
.sort-bar button { background: none; border: 1px solid var(--border); border-radius: 16px; padding: 4px 12px; color: var(--text-light); cursor: pointer; }
.sort-bar button.active { background: var(--accent-warm); color: var(--text); border-color: var(--accent); }
.article-card { background: var(--bg-card); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; box-shadow: var(--shadow); cursor: pointer; }
.article-card .date { font-size: 12px; color: var(--text-light); margin-bottom: 6px; }
.article-card h2 { font-size: 18px; margin-bottom: 6px; }
.article-card .excerpt { font-size: 14px; color: #666; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.article-content { background: var(--bg-card); border-radius: 12px; padding: 24px 20px; box-shadow: var(--shadow); margin-bottom: 24px; }
.article-content p { margin-bottom: 16px; }
.article-content img { max-width: 100%; border-radius: 8px; margin: 12px 0; }
.highlight { background: var(--highlight); border-bottom: 2px solid var(--accent); cursor: pointer; border-radius: 2px; padding: 0 2px; }
.comment { background: var(--bg-card); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
.comment .floor { font-size: 12px; color: var(--text-light); }
.comment .user { font-weight: 600; font-size: 14px; }
.comment .time { font-size: 12px; color: var(--text-light); margin-left: 8px; }
.comment .text { margin: 8px 0; }
.comment .actions { font-size: 13px; color: var(--text-light); }
.comment .actions span { cursor: pointer; margin-right: 12px; }
.comment .liked { color: #e07a5f; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; }
.bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); border-radius: 16px 16px 0 0; padding: 20px; z-index: 201; transform: translateY(100%); transition: transform 0.25s; }
.bottom-sheet.show { transform: translateY(0); }
.bottom-sheet textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 15px; height: 80px; font-family: inherit; }
.bottom-sheet .btns { display: flex; gap: 10px; margin-top: 12px; justify-content: flex-end; }
.bottom-sheet button { padding: 8px 18px; border-radius: 20px; border: none; cursor: pointer; }
.bottom-sheet .cancel { background: var(--border); }
.bottom-sheet .submit { background: var(--accent); color: white; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; display: flex; align-items: center; justify-content: center; }
.modal { background: var(--bg-card); border-radius: 16px; padding: 28px 24px; max-width: 320px; text-align: center; }
.modal button { background: var(--accent); color: white; border: none; border-radius: 20px; padding: 10px 28px; cursor: pointer; margin-top: 12px; }
.login-box { background: var(--bg-card); border-radius: 12px; padding: 28px 24px; max-width: 360px; margin: 40px auto; box-shadow: var(--shadow); }
.login-box input, .login-box textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; }
.login-box button { padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; }
footer { text-align: center; padding: 24px 16px 40px; font-size: 12px; color: var(--text-light); }
footer .disclaimer { max-width: 640px; margin: 12px auto 0; padding: 12px 16px; background: rgba(255,255,255,0.6); border-radius: 8px; border: 1px solid var(--border); line-height: 1.7; }
</style>
</head>
<body>

<header onclick="showList()">
  <img class="logo" src="logo.png" alt="logo">
  <div>
    <div class="title">苗博</div>
    <div class="subtitle">演员谢苗超话</div>
  </div>
  <div class="right" id="authArea" onclick="event.stopPropagation()"></div>
</header>

<main id="main"></main>

<footer>
  <div>制作：Kokoro | 林科森</div>
  <div class="disclaimer">◆ 本站为谢苗粉丝向博客考古站，非官方、非商业、不盈利。文章内容由粉丝整理分享，著作权归谢苗所有。请勿发布无关或引起不适的内容，自觉遵守网络规范。用户需对自身发言负责，本站有权删除不当内容。如有侵权或不妥，请联系我们删除。感谢配合。 ◆</div>
</footer>

<div class="modal-overlay" id="initModal">
  <div class="modal">
    <h3>苗博</h3>
    <p>一次穿越时空的聚会<br>谢苗早年博客考古站<br><br>制作：Kokoro | 林科森<br><br>本站为粉丝向，非官方、不盈利，著作权归谢苗。</p>
    <button id="startBtn">开始阅读</button>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="bottom-sheet" id="sheet">
  <textarea id="highlightInput" placeholder="写下你对这段文字的评论..."></textarea>
  <div class="btns">
    <button class="cancel" id="cancelBtn">取消</button>
    <button class="submit" id="submitBtn">画线并评论</button>
  </div>
</div>

<script>
const admins = ['Kokoro', '林科森'];
let posts = JSON.parse(localStorage.getItem('miaobo_posts') || 'null') || [{
  id: 1,
  title: "一次穿越时空的聚会！！！",
  date: "2009-01-14 18:27",
  excerpt: "11号在光线传媒举行了新老少林寺主创的联欢会~~ 两代“少林弟子”齐聚一堂，气氛其乐融融！",
  content: `<p>11号在光线传媒举行了新老少林寺主创的联欢会~~ 两代“少林弟子”齐聚一堂，气氛其乐融融！</p><p>对于电影《少林寺》我想没有人会感到陌生，那是中国电影的一个神话，也是功夫电影的一个标志。作为老电影《少林寺》的代表，演员计春华、于海、于承惠。导演张鑫炎以及主题曲《少林少林》的作曲家王立平老师等前辈悉数到场。</p><p>我感到这次机会的难得，更加体会到这次机会的珍贵！所以我们也尽自己的努力献上各式各样的节目~~ 值得一提的是我和李渊的“舞蹈”，颇费了我们一番心血... 迈克的舞蹈融合了中国的武术，我想这是我们这台节目的看点之一！</p><p>如果不是这次机缘，我想很难有机会能和这么多“少林”前辈们同台交流，兴奋之情无以言表！</p><p>看着与前辈们的一张张合影，给了我更多的信念与鼓励！感谢少林，让我们新老主创一同在神圣的舞台上体会百味人生；感谢前辈，让新一代的我们有了为之奋斗的动力；感谢观众，让掌声源源不断的作为我们身后支撑的无穷力量！让我们真诚祝愿：祝愿“少林之路”更加流光溢彩，更加璀璨辉煌！</p>`
}];
let comments = JSON.parse(localStorage.getItem('miaobo_comments') || '[]');
let highlights = JSON.parse(localStorage.getItem('miaobo_highlights') || '[]');
let currentUser = localStorage.getItem('miaobo_user') || null;
let currentSort = 'newest';
let selectedText = '';
let currentPostId = null;

function saveAll() {
  localStorage.setItem('miaobo_posts', JSON.stringify(posts));
  localStorage.setItem('miaobo_comments', JSON.stringify(comments));
  localStorage.setItem('miaobo_highlights', JSON.stringify(highlights));
}
function isAdmin() { return currentUser && admins.includes(currentUser); }

function showList() {
  const sorted = [...posts].sort((a,b) => currentSort === 'oldest' ? new Date(a.date) - new Date(b.date) : new Date(b.date) - new Date(a.date));
  document.getElementById('main').innerHTML = `
    <div class="sort-bar">
      <button class="${currentSort==='oldest'?'active':''}" onclick="setSort('oldest')">最早优先</button>
      <button class="${currentSort==='newest'?'active':''}" onclick="setSort('newest')">最新优先</button>
    </div>
    ${sorted.map(p => `<div class="article-card" onclick="showArticle(${p.id})"><div class="date">${p.date}</div><h2>${p.title}</h2><div class="excerpt">${p.excerpt}</div></div>`).join('')}
  `;
  updateAuth();
}
function setSort(s) { currentSort = s; showList(); }

function showArticle(id) {
  currentPostId = id;
  const p = posts.find(x => x.id === id);
  const postComments = comments.filter(c => c.postId === id);
  const postHighlights = highlights.filter(h => h.postId === id);
  let content = p.content;
  postHighlights.forEach(h => {
    if (content.includes(h.text)) content = content.replace(h.text, `<span class="highlight" data-id="${h.id}">${h.text}</span>`);
  });
  document.getElementById('main').innerHTML = `
    <div style="margin-bottom:12px;font-size:14px;color:var(--text-light);"><a href="#" onclick="showList();return false;">← 返回列表</a></div>
    <h1 style="font-size:24px;margin-bottom:8px;">${p.title}</h1>
    <div style="font-size:13px;color:var(--text-light);margin-bottom:20px;">${p.date} ${isAdmin() ? `<a href="#" onclick="editArticle(${p.id});return false;" style="margin-left:12px;">编辑</a>` : ''}</div>
    <div class="article-content" id="articleContent">${content}</div>
    <div style="margin-top:28px;"><h3 style="margin-bottom:12px;">评论</h3>
      ${postComments.length === 0 ? '<p style="color:var(--text-light);font-size:14px;">还没有评论</p>' : ''}
      ${postComments.map((c,i) => `<div class="comment"><div class="floor">${i+1}楼</div><div><span class="user">${c.user}</span><span class="time">${c.time}</span></div><div class="text">${c.text}</div><div class="actions"><span onclick="likeComment(${c.id})">♡ ${c.likes||0}</span>${currentUser?`<span onclick="replyComment(${c.id})">回复</span>`:''}</div></div>`).join('')}
      ${currentUser ? `<div style="margin-top:16px;"><textarea id="newComment" placeholder="写下评论..." style="width:100%;height:80px;padding:10px;border:1px solid var(--border);border-radius:8px;"></textarea><button onclick="addComment()" style="margin-top:8px;background:var(--accent);color:white;border:none;padding:8px 16px;border-radius:16px;cursor:pointer;">发表</button></div>` : '<p style="margin-top:12px;font-size:14px;color:var(--text-light);">登录后可以评论和画线</p>'}
    </div>
  `;
  document.getElementById('articleContent').addEventListener('mouseup', onSelect);
  document.getElementById('articleContent').addEventListener('touchend', onSelect);
  updateAuth();
}

function onSelect() {
  if (!currentUser) return;
  const text = window.getSelection().toString().trim();
  if (text.length > 4) {
    selectedText = text;
    document.getElementById('overlay').style.display = 'block';
    document.getElementById('sheet').classList.add('show');
    document.getElementById('highlightInput').focus();
  }
}

function editArticle(id) {
  const p = posts.find(x => x.id === id);
  document.getElementById('main').innerHTML = `
    <h2 style="margin-bottom:16px;">编辑文章</h2>
    <div class="login-box" style="max-width:100%;">
      <input id="editTitle" value="${p.title}" />
      <input id="editDate" value="${p.date}" />
      <textarea id="editContent" style="height:280px;">${p.content}</textarea>
      <div style="margin-bottom:12px;"><input type="file" accept="image/*" id="imgInput" /></div>
      <button onclick="saveEdit(${id})">保存</button>
      <button onclick="showArticle(${id})" style="background:var(--border);color:var(--text);margin-left:8px;">取消</button>
    </div>
  `;
  document.getElementById('imgInput').onchange = function() {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const ta = document.getElementById('editContent');
      const pos = ta.selectionStart;
      const img = `<p><img src="${e.target.result}"></p>`;
      ta.value = ta.value.slice(0, pos) + img + ta.value.slice(pos);
    };
    reader.readAsDataURL(file);
  };
}

function saveEdit(id) {
  const p = posts.find(x => x.id === id);
  p.title = document.getElementById('editTitle').value;
  p.date = document.getElementById('editDate').value;
  p.content = document.getElementById('editContent').value;
  p.excerpt = p.content.replace(/<[^>]+>/g,'').slice(0,50) + '...';
  saveAll();
  showArticle(id);
}

function addComment() {
  const text = document.getElementById('newComment').value.trim();
  if (!text) return;
  comments.push({ id: Date.now(), postId: currentPostId, user: currentUser, text, time: new Date().toLocaleString('zh-CN'), likes: 0 });
  saveAll();
  showArticle(currentPostId);
}
function likeComment(id) {
  const c = comments.find(x => x.id === id);
  if (c) { c.likes = (c.likes||0) + 1; saveAll(); showArticle(currentPostId); }
}
function replyComment(id) {
  const text = prompt('回复内容：');
  if (!text) return;
  comments.push({ id: Date.now(), postId: currentPostId, user: currentUser, text: '回复：' + text, time: new Date().toLocaleString('zh-CN'), likes: 0, parent: id });
  saveAll();
  showArticle(currentPostId);
}

function showLogin() {
  document.getElementById('main').innerHTML = `
    <div class="login-box">
      <h2 style="text-align:center;margin-bottom:16px;" id="authTitle">登录</h2>
      <input id="username" placeholder="用户名" />
      <input id="password" type="password" placeholder="密码" />
      <button id="authBtn" onclick="doAuth()">登录</button>
      <p style="font-size:12px;text-align:center;margin-top:12px;color:var(--text-light);" id="authHint">还没有账号？<a href="#" onclick="toggleAuth();return false;">去注册</a><br>管理员：Kokoro / 林科森（密码 admin）</p>
    </div>
  `;
}
let isReg = false;
function toggleAuth() {
  isReg = !isReg;
  document.getElementById('authTitle').textContent = isReg ? '注册' : '登录';
  document.getElementById('authBtn').textContent = isReg ? '注册' : '登录';
  document.getElementById('authHint').innerHTML = isReg ? '已有账号？<a href="#" onclick="toggleAuth();return false;">去登录</a>' : '还没有账号？<a href="#" onclick="toggleAuth();return false;">去注册</a><br>管理员：Kokoro / 林科森（密码 admin）';
}
function doAuth() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (!u || !p) return alert('请填写用户名和密码');
  let users = JSON.parse(localStorage.getItem('miaobo_users') || '{}');
  if (!users['Kokoro']) users['Kokoro'] = 'admin';
  if (!users['林科森']) users['林科森'] = 'admin';
  if (isReg) {
    if (users[u]) return alert('用户名已存在');
    users[u] = p;
    localStorage.setItem('miaobo_users', JSON.stringify(users));
    alert('注册成功');
    isReg = false;
    showLogin();
    return;
  }
  if (users[u] !== p) return alert('用户名或密码错误');
  currentUser = u;
  localStorage.setItem('miaobo_user', u);
  showList();
}
function updateAuth() {
  const area = document.getElementById('authArea');
  area.innerHTML = currentUser ? `${currentUser} <a href="#" onclick="logout();return false;">退出</a>` : `<a href="#" onclick="showLogin();return false;">登录</a>`;
}
function logout() {
  currentUser = null;
  localStorage.removeItem('miaobo_user');
  showList();
}

document.getElementById('startBtn').onclick = () => {
  document.getElementById('initModal').style.display = 'none';
  localStorage.setItem('miaobo_init_seen', '1');
  showList();
};
document.getElementById('overlay').onclick = () => {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('sheet').classList.remove('show');
};
document.getElementById('cancelBtn').onclick = () => document.getElementById('overlay').click();
document.getElementById('submitBtn').onclick = () => {
  const comment = document.getElementById('highlightInput').value.trim();
  if (!comment || !selectedText) return;
  highlights.push({ id: Date.now(), postId: currentPostId, text: selectedText, comment, user: currentUser, likes: 0 });
  saveAll();
  document.getElementById('overlay').click();
  showArticle(currentPostId);
};

if (localStorage.getItem('miaobo_init_seen')) document.getElementById('initModal').style.display = 'none';
showList();
</script>
</body>
</html>
