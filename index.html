*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:16px}

.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}

.filter-panel{background:var(--card);border-radius:12px;padding:12px;margin-bottom:16px;box-shadow:var(--shadow);display:none}
.filter-panel.show{display:block}

.filter-panel .months span{background:var(--bg);border-radius:12px;padding:2px 10px;font-size:12px;cursor:pointer}
.filter-panel .months span.active{background:var(--warm)}
.card{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer}
.card .date{font-size:12px;color:var(--light);margin-bottom:6px}
.card h2{font-size:18px;margin-bottom:6px}
.excerpt{font-size:14px;color:#666;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.content{background:var(--card);border-radius:12px;padding:24px 20px;box-shadow:var(--shadow);margin-bottom:24px}
.content p{margin-bottom:16px}
.content img,#ec img{max-width:100%;border-radius:8px;margin:12px 0}
.highlight{background:var(--hl);border-bottom:2px solid var(--accent);cursor:pointer;border-radius:2px;padding:0 2px}
.comment{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.comment .floor{font-size:12px;color:var(--light)}

.comment .text{margin:8px 0}

.comment .actions span{cursor:pointer;margin-right:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;padding:20px;z-index:201;transform:translateY(100%);transition:.25s}
.sheet.show{transform:translateY(0)}

.sheet .btns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.sheet button{padding:8px 16px;border-radius:20px;border:none;cursor:pointer}

.sheet .ok{background:var(--accent);color:#fff}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border-radius:16px;padding:28px 24px;max-width:320px;text-align:center}
.modal button{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:10px 28px;cursor:pointer;margin-top:12px}
.box{background:var(--card);border-radius:12px;padding:28px 24px;max-width:360px;margin:40px auto;box-shadow:var(--shadow)}
.box input,.box textarea{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit}
.box button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer}
footer{text-align:center;padding:24px 16px 40px;font-size:12px;color:var(--light)}
footer .dis{max-width:640px;margin:12px auto 0;padding:12px 16px;background:rgba(255,255,255,.6);border-radius:8px;border:1px solid var(--border);line-height:1.7}

function paintHighlights(){const root=$('ac'),walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];let n,offset=0;while(n=walker.nextNode()){nodes.push({n,start:offset});offset+=n.length}const text=root.textContent;const spans=highlights.map(h=>{const saved=h.start_offset;const start=Number.isInteger(saved)&&text.slice(saved,saved+h.selected_text.length)===h.selected_text?saved:text.indexOf(h.selected_text);return {h,start,end:start+h.selected_text.length}}).filter(x=>x.start>=0);for(const {n,start} of nodes){const cuts=new Set([0,n.length]);for(const s of spans){if(s.start<start+n.length&&s.end>start){cuts.add(Math.max(0,s.start-start));cuts.add(Math.min(n.length,s.end-start))}}const points=[...cuts].sort((a,b)=>a-b),frag=document.createDocumentFragment();for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1],s=spans.find(x=>x.start<=start+a&&x.end>=start+b);const el=s?document.createElement('mark'):document.createTextNode(n.data.slice(a,b));if(s)el.textContent=n.data.slice(a,b);if(s){el.className='highlight';el.setAttribute('aria-label','查看这段文字的评论');let downAt=0,moved=false;el.onpointerdown=()=>{downAt=Date.now();moved=false};el.onpointermove=()=>{moved=true};el.onclick=()=>{if(moved||Date.now()-downAt>300||hasArticleSelection())return;showHLComments(s.h.selected_text)}}frag.append(el)}n.replaceWith(frag)}}

async function makeExcerpt(){if(!selText)return;await document.fonts.ready;const p=posts.find(p=>same(p.id,curId)),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');const wrap=(text,max)=>{const lines=[];for(const paragraph of text.split('\n')){let line='';for(const c of paragraph){if(ctx.measureText(line+c).width>max&&line){lines.push(line);line=''}line+=c}lines.push(line)}return lines};ctx.font='28px "Microsoft YaHei",sans-serif';const lines=wrap(selText,540);if(lines.length>150)return notice('选文过长，请分段生成书摘');ctx.font='24px "Microsoft YaHei",sans-serif';const titles=wrap('/《'+p.title.replace(/^《([\s\S]*)》$/,'$1')+'》',540);canvas.width=660;canvas.height=230+lines.length*48+titles.length*40;ctx.fillStyle='#faf6f1';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#3a3530';ctx.font='28px "Microsoft YaHei",sans-serif';lines.forEach((l,i)=>ctx.fillText(l,60,80+i*48));let y=110+lines.length*48;ctx.fillStyle='#8a8075';ctx.font='24px "Microsoft YaHei",sans-serif';titles.forEach(l=>{ctx.fillText(l,60,y);y+=40});ctx.font='22px "Microsoft YaHei",sans-serif';ctx.fillText('By 谢苗',60,y);ctx.fillStyle='#a69a8d';ctx.font='17px "Microsoft YaHei",sans-serif';ctx.fillText('苗博·演员谢苗超话',60,y+40);canvas.toBlob(blob=>{if(!blob)return notice('图片生成失败');const url=URL.createObjectURL(blob),overlay=document.createElement('div');overlay.className='modal-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','书摘预览');overlay.setAttribute('aria-modal','true');overlay.style.cssText='padding:24px;background:rgba(0,0,0,.58);backdrop-filter:blur(3px)';const box=document.createElement('div');box.style.cssText='width:min(100%,320px);text-align:center;position:relative';const img=new Image();img.src=url;img.alt='书摘图片，长按保存';img.style.cssText='display:block;width:100%;max-height:68dvh;object-fit:contain;border-radius:5px;box-shadow:0 12px 40px #0003';const b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label','关闭书摘');b.style.cssText='display:block;margin:18px auto 0;width:36px;height:36px;border:1px solid #ffffff70;border-radius:50%;background:transparent;color:white;font-size:26px;line-height:30px;padding:0';const previous=document.activeElement;const close=()=>{overlay.remove();URL.revokeObjectURL(url);document.removeEventListener('keydown',onKey);if(previous?.isConnected)previous.focus()};const onKey=e=>{if(e.key==='Escape'){e.stopImmediatePropagation();close()}if(e.key==='Tab'){e.preventDefault();b.focus()}};b.onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};document.addEventListener('keydown',onKey);const tip=document.createElement('p');tip.textContent='长按图片保存';tip.style.cssText='margin:14px 0 0;color:#ffffffb3;font-size:12px;letter-spacing:1px';box.append(img,tip,b);overlay.append(box);document.body.append(overlay);b.focus()},'image/png');closeSheet()}

async function uploadEditorImage(file){if(!file||!file.type.startsWith('image/'))return notice('请选择图片文件');if(file.size>25000000)return notice('图片过大，请选择小于 25 MB 的照片');try{const source=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('图片读取失败'));reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)});let data=source;if(file.size>1200000||!/^image\/(jpeg|png|gif|webp)$/.test(file.type)){const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('此照片格式暂不支持，请在相册中转为 JPG 后添加'));img.src=source});const scale=Math.min(1,1600/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);data=canvas.toDataURL('image/jpeg',.82)}if(!$('ec'))return;insertEditorHTML('<p><img src="'+data+'" alt="配图"></p><p><br></p>')}catch(e){notice(e.message)}}

function editPost(){if(!isAdmin())return;closeHLDiscussion(false);rememberCurrentView();view='editor';releaseArticleImages();hideSelectionMenu();editingPost=true;version++;editorRange=null;const p=(curId!==null&&(same(currentArticle?.id,curId)?currentArticle:cachedArticle(curId)))||{title:'',date:new Date().toISOString(),content:''};const draft=read('mb_editor_'+(curId??'new'),null);$('main').innerHTML=`<h2 style="margin-bottom:16px">${curId===null?'写文章':'编辑'}</h2><div class="box" style="max-width:100%;margin:0"><label>标题<input id="et" placeholder="填写标题"></label><label>原文日期<input id="ed" type="date"></label><div style="display:flex;align-items:center;gap:12px;margin:8px 0"><b>正文</b><button type="button" onclick="keepEditorSelection();$('ei').click()">＋ 从相册添加图片</button><input id="ei" type="file" accept="image/*" multiple hidden style="display:none!important" aria-label="选择图片"></div><div id="ec" class="content article-editor" contenteditable="true" role="textbox" aria-label="正文" aria-multiline="true" style="min-height:320px;max-height:65dvh;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere"></div><p style="font-size:12px;color:var(--light);margin:8px 0 16px">直接编辑文字和图片，发布后保持这里的排版。未发布内容自动保留在本机。</p><p id="publishMessage" role="status" style="font-size:14px;margin-bottom:12px"></p><button id="publishButton" onclick="savePost()">${curId===null?'发布':'保存修改'}</button> <button onclick="if(!writing){editingPost=false;curId===null?showList():showArticle(curId)}">返回</button></div>`;$('et').value=draft?.title??p.title;$('ed').value=draft?.date?.slice(0,10)??articleDate(p.date,false);$('ec').innerHTML=clean(draft?.content??p.content);$('ec').querySelectorAll('img').forEach(img=>img.style.maxWidth='100%');$('ec').oninput=saveEditorDraft;$('et').oninput=$('ed').oninput=saveEditorDraft;$('ec').onkeyup=$('ec').onmouseup=keepEditorSelection;$('ec').onpaste=e=>{e.preventDefault();keepEditorSelection();const image=[...e async function savePost(){if(!isAdmin()||writing||!needAuth())return;const title=$('et').value.trim(),date=new Date($('ed').value+'T00:00:00+08:00'),content=clean($('ec').innerHTML),div=document.createElement('div');div.innerHTML=content;if(!title||isNaN(date)||(!div.textContent.trim()&&!div.querySelector('img')))return $('publishMessage').textContent='请填写标题、时间和正文。';saveEditorDraft();const oldId=curId,button=$('publishButton');writing=true;button.disabled=true;button.textContent='正在保存…';$('publishMessage').textContent='正在上传，请稍候…';try{const payload={title,content,excerpt:div.textContent.slice(0,100),published_at:date.toISOString(),updated_at:new Date().toISOString()},q=oldId===null?sb.from('posts').insert(payload):sb.from('posts').update(payload).eq('id',oldId);const row=await query(q.select().single()),p={...row,date:row.published_at};putCatalog(row);cacheArticle(p);currentArticle=p;store('mb_editor_'+(oldId??'new'),'null');curId=row.id;editingPost=false;notice(oldId===null?'发布成功':'修改已保存');await showArticle(row.id)}catch(e){if($('publishMessage'))$('publishMessage').textContent='保存未完成：'+e.message+'。草稿已保留。'}finally{writing=false;if(button.isConnected){button.disabled=false;button.textContent=oldId===null?'发布':'保存修改'}}}

function authError(e){const m=e?.message||String(e);if(/Invalid login credentials/i.test(m))return '用户名或密码不正确；请确认已经注册账号。';if(/Email not confirmed/i.test(m))return '账号邮箱尚未验证。当前用户名使用虚拟邮箱，无法接收验证邮件，需要管理员检查 Supabase 邮箱确认配置。';if(/invalid.*email|email.*invalid/i.test(m))return '不接受当前虚拟邮箱：'+m;if(/Database error saving new user/i.test(m))return '账号创建时数据库报错，请检查 Auth 日志和 profiles 注册触发器。原始错误：'+m;if(/fetch|network|timeout|连接超时/i.test(m))return '连接超时或网络失败，暂时无法确认操作结果。请先到 Supabase Users 查看是否已创建账号，再重试登录。';if(/already registered/i.test(m))return '账号已经注册，请切换登录。';return '返回：'+m}

async function doAuth(){if(authBusy)return;if(!sb)return authMessage('登录服务未加载，可能是 CDN 网络失败，请刷新页面后重试。');const u=$('un').value.trim().normalize('NFC'),password=$('pw').value;if(!u||!password)return authMessage('请填写用户名和密码。');if(u.length>40)return authMessage('用户名最多 40 个字符。');if(reg&&password.length<6)return authMessage('注册密码至少 6 位，请设置新密码；admin 是旧版本地密码。');const registering=reg,button=$('authSubmit');authBusy=true;button.disabled=true;button.textContent=registering?'正在注册…':'正在登录…';authMessage(registering?'正在连接并创建账号…':'正在验证账号…','progress');try{const r=await bounded(registering?sb.auth.signUp({email:emailFor(u),password,options:{data:{username:u}}}):sb.auth.signInWithPassword({email:emailFor(u),password}));if(r.error)throw r.error;if(!r.data?.session){authMessage(registering?'注册请求已返回，但未获得登录会话。请到 Supabase → Authentication → Users 确认账号是否创建；若需要邮箱确认，虚拟邮箱无法收信，请管理员检查确认设置。':'未返回登录会话，请重试。','error');return}session=r.data.session;user=session.user.user_metadata?.username||u;profile=null;let warning='';try{profile=await query(sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle());if(profile)user=profile.username;else warning='账号资料未创建，请检查 profiles 注册触发器。'}catch(e){warning='账号已登录，但资料读取失败：'+e.message}authUI();showList();status((registering?'注册成功，已登录':'登录成功')+' · '+user+(warning?' · '+warning:''));notice(registering?'注册成功，已登录':'登录成功')}catch(e){authMessage(authError(e))}finally{authBusy=false;if(button.isConnected){button.disabled=false;button.textContent=registering?'注册':'登录'}}}

function showList(){closeHLDiscussion(false);rememberCurrentView();if(location.hash&&location.hash!=='#home'){history.pushState({miaoboList:true},'','#home')}routeKey='';applyListRoute()}
function backToList(){rememberCurrentView();if(history.state?.fromMiaoboList){history.back()}else showList()}
function showArticle(id){id=String(id);if(!/^\d+$/.test(id))return;const sameRoute=routeId()===id;const fromList=view==='list';rememberCurrentView();if(!sameRoute)history.pushState({fromMiaoboList:fromList,articleScroll:0},'','#post='+id);routeKey='post:'+id;return loadArticle(id,sameRoute&&view==='article'?window.scrollY:(history.state?.articleScroll||0))}
function onRouteChange(){const id=routeId(),key=id?'post:'+id:'home';if(routeKey===key)return;routeKey=key;if(id)loadArticle(id,history.state?.articleScroll||0);else{const saved=history.state?.list;if(saved){sort=saved.sort;filter=saved.filter;searchTerm=saved.search;visiblePosts=saved.visible;listScroll=saved.scroll}applyListRoute()}}
function applyListRoute(){routeKey='home';view='list';curId=null;editingPost=false;pendingArticleRender=null;articleTouchActive=false;releaseArticleImages();hideSelectionMenu();version++;renderedArticleId=null;renderedArticleContent=null;pendingListRestore=listScroll;renderList();restoreScroll(listScroll);loadPosts();if(searchTerm)runSearch()}
function restoreListAfterData(){if(view==='list'&&pendingListRestore!==null&&!searchLoading){restoreScroll(pendingListRestore);pendingListRestore=null}}
window.addEventListener('popstate',onRouteChange);
window.addEventListener('hashchange',onRouteChange);
window.addEventListener('pagehide',rememberCurrentView);
let browseScrollTimer;
window.addEventListener('scroll',()=>{clearTimeout(browseScrollTimer);browseScrollTimer=setTimeout(()=>{if(view==='list')rememberList();else if(view==='article')history.replaceState({...history.state,articleScroll:window.scrollY},'',location.href)},250)},{passive:true});

async function catalogRows(term=''){
 const rows=[];
 for(let start=0;;start+=1000){
  let request=sb.from('posts').select(POST_FIELDS).order('published_at',{ascending:false}).order('id',{ascending:false});
  if(term){const pattern='%'+term.replace(/\\/g,'\\\\').replace(/%/g,'\\%').replace(/_/g,'\\_')+'%',literal=JSON.stringify(pattern);request=request.or('title.ilike.'+literal+',content.ilike.'+literal)}
  const page=await query(request.range(start,start+999));rows.push(...page.map(postSummary));if(page.length<1000)return rows;
 }
}
async function loadPosts(){const request=++catalogRequest;status(posts.length?'正在同步…':'正在读取…');if(!sb){status('离线阅读 · 当前内容来自本机缓存');return}try{const rows=await catalogRows();if(request!==catalogRequest)return;posts=rows;cacheCatalog();if(view==='list'){status(rows.length?'已连接':'暂无，管理员登录后可发布');renderList();restoreListAfterData();loadPostStats(version)}}catch(e){if(view==='list')status('离线阅读 · '+e.message+' · 显示本机缓存')}}
function setSort(value){if(value==='hot'&&!statsReady)return notice('互动数据暂不可用，请稍后重试');sort=value;visiblePosts=12;renderList();rememberList()}
function setDateFilter(year=null,month=null){filter=year?{y:Number(year),...(month?{m:Number(month)}:{})}:null;visiblePosts=12;$('fp')?.classList.remove('show');renderList();rememberList()}
function onSearchInput(){searchTerm=$('postSearch').value.slice(0,80);visiblePosts=12;searchError='';clearTimeout(searchTimer);searchRequest++;if(!searchTerm.trim()){searchResults=null;searchLoading=false;renderList();rememberList();return}searchLoading=true;renderList();searchTimer=setTimeout(runSearch,350)}
function clearSearch(){clearTimeout(searchTimer);searchRequest++;searchTerm='';searchResults=null;searchLoading=false;searchError='';if($('postSearch'))$('postSearch').value='';renderList();rememberList();$('postSearch')?.focus()}
async function runSearch(){const term=searchTerm.trim(),request=++searchRequest;if(!term){searchResults=null;searchLoading=false;renderList();return}searchLoading=true;if(view==='list')renderList();try{if(!sb)throw Error('offline');const rows=await catalogRows(term);if(request!==searchRequest)return;searchResults=rows;searchError=''}catch{if(request!==searchRequest)return;const q=term.toLocaleLowerCase();searchResults=posts.filter(p=>(p.title+' '+p.excerpt).toLocaleLowerCase().includes(q));searchError='联网搜索暂不可用，以下仅匹配本机标题和摘要。'}finally{if(request===searchRequest){searchLoading=false;if(view==='list')renderList();restoreListAfterData();rememberList()}}}
function activeList(){const source=searchTerm.trim()?(searchResults||[]):posts;return source.filter(p=>{if(!filter)return true;const [y,m]=articleDate(p.date,false).split('-').map(Number);return y===filter.y&&(!filter.m||m===filter.m)}).sort(comparePosts)}
function renderList(){
 if(view!=='list')return;authUI();
 if(!$('listRoot')){$('main').innerHTML=`<section id="listRoot"><div id="adminPostEntry"></div><form class="post-search" role="search" onsubmit="event.preventDefault();clearTimeout(searchTimer);runSearch()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="postSearch" type="search" maxlength="80" autocomplete="off" aria-label="搜索标题或正文" placeholder="搜索标题或正文" oninput="onSearchInput()"><button id="clearPostSearch" type="button" onclick="clearSearch()" aria-label="清空搜索">×</button></form><div class="sort-bar"><button id="dateFilterLabel" onclick="$('fp').classList.toggle('show')"></button><div>${[['oldest','最早优先'],['newest','最新优先'],['hot','热度优先']].map(([value,label])=>`<button data-sort="${value}" onclick="setSort('${value}')" ${value==='hot'?'title="点赞＋评论×2＋划线评论×2"':''}>${label}</button>`).join('')}</div></div><div class="filter-panel" id="fp"></div><p id="listSummary" class="list-summary" role="status" aria-live="polite"></p><div id="postCards"></div><div id="morePosts"></div></section>`;$('postSearch').value=searchTerm}
 $('adminPostEntry').innerHTML=isAdmin()?'<button class="write-entry" onclick="newPost()">＋ 写文章</button>':'';
 $('clearPostSearch').hidden=!searchTerm;$('dateFilterLabel').textContent=filter?filter.y+'年'+(filter.m?filter.m+'月':''):'全部时间';
 for(const b of document.querySelectorAll('[data-sort]')){b.classList.toggle('active',b.dataset.sort===sort);b.setAttribute('aria-pressed',String(b.dataset.sort===sort))}
 const ym={};for(const p of posts){const [y,m]=articleDate(p.date,false).split('-').map(Number);if(y)(ym[y]??=new Set()).add(m)}
 $('fp').innerHTML=`<button onclick="setDateFilter()">全部时间</button>${Object.keys(ym).sort((a,b)=>b-a).map(y=>`<button class="filter-year" onclick="setDateFilter(${y})">${y}年</button><div class="months">${[...ym[y]].sort((a,b)=>a-b).map(m=>`<button class="filter-month ${filter?.y===Number(y)&&filter?.m===m?'active':''}" onclick="setDateFilter(${y},${m})">${m}月</button>`).join('')}</div>`).join('')}`;
 const list=activeList();$('listSummary').textContent=searchLoading?'正在搜索…':searchError||(searchTerm.trim()?'找到 '+list.length+' 篇':'共 '+list.length+' 篇');
 $('postCards').innerHTML=searchLoading?'<div class="list-empty">正在查找相关内容…</div>':list.slice(0,visiblePosts).map(p=>`<a class="card post-card" href="#post=${esc(p.id)}" onclick="if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;event.preventDefault();showArticle('${esc(p.id)}')"><div class="date">${esc(articleDate(p.date))}</div><h2>${esc(p.title)}</h2>${p.excerpt?`<div class="excerpt">${esc(p.excerpt)}</div>`:''}${postCounters(p.id)}<span class="card-read" aria-hidden="true">阅读全文 →</span></a>`).join('')||'<div class="list-empty">'+(searchTerm.trim()?'没有找到相关内容，换个关键词试试吧。':'暂无')+'</div>';
 $('morePosts').innerHTML=!searchLoading&&list.length>visiblePosts?'<button class="load-more" onclick="visiblePosts+=12;renderList();rememberList()">再看一些</button>':'';
}

async function discussionRows(id){
 const [cs,hs]=await Promise.all([query(sb.from('comments').select('*').eq('post_id',id).order('created_at')),query(sb.from('highlights').select('*').eq('post_id',id).order('created_at'))]);
 const ids=[...new Set([...cs,...hs].map(x=>x.user_id).filter(Boolean))],targetIds=[...new Set([...cs,...hs].map(x=>x.id))];
 const [ps,ls]=await Promise.all([ids.length?query(sb.from('profiles').select('id,username').in('id',ids)):[],targetIds.length?query(sb.from('likes').select('*').in('target_id',targetIds)):[]]);
 return [cs,hs,ps,ls];
}
async function loadArticle(id,scroll=0){closeHLDiscussion(false);
 const v=++version;view='article';editingPost=false;curId=id;if(!same(renderedArticleId,id))replyToId=null;pendingArticleRender=null;articleTouchActive=false;hideSelectionMenu();
 const cached=cachedArticle(id);currentArticle=cached;comments=read('mb_v2_comments_'+id,[]);highlights=read('mb_v2_highlights_'+id,[]);
 if(cached)renderArticle(cached);else{releaseArticleImages();renderedArticleId=null;renderedArticleContent=null;$('main').innerHTML='<a href="#home" onclick="event.preventDefault();backToList()">← 返回</a><div class="article-loading" role="status">正在读取…</div>';authUI()}
 restoreScroll(scroll);if(!sb){status(cached?'离线阅读 · 当前来自本机缓存':'暂时无法读取，请联网后重试');return}
 status('正在同步…');loadPostStats(v,false);
 const articleJob=(async()=>{try{const row=await query(sb.from('posts').select('*').eq('id',id).single());if(v!==version)return;currentArticle={...row,date:row.published_at};putCatalog(row);cacheArticle(currentArticle);renderArticle(currentArticle);if(!cached)restoreScroll(scroll);status('已连接')}catch(e){if(v!==version)return;status(cached?'同步失败，显示本机缓存 · '+e.message:'暂时无法读取 · '+e.message);if(!cached)$('main').innerHTML='<a href="#home" onclick="event.preventDefault();backToList()">← 返回</a><div class="list-empty"><p>内容暂时未能加载。</p><button onclick="showArticle(curId)">重试</button></div>'}})();
 const discussionJob=(async()=>{try{const rows=await discussionRows(id);if(v!==version)return;[comments,highlights,profiles,likes]=rows;store('mb_v2_comments_'+id,JSON.stringify(comments));store('mb_v2_highlights_'+id,JSON.stringify(highlights));if(currentArticle)renderArticle(currentArticle)}catch{if(v===version&&$('discussionMessage'))$('discussionMessage').textContent='评论暂未加载，可以稍后重试。'}})();
 await Promise.allSettled([articleJob,discussionJob]);
}
function renderArticle(p){
 if(view!=='article'||!same(p.id,curId))return;
 const hasSameBody=same(renderedArticleId,p.id)&&renderedArticleContent===p.content&&$('ac');
 if(hasSameBody){renderComments();updatePostLikeUI();refreshArticleHighlights();return}
 if($('ac')&&same(renderedArticleId,p.id)&&(articleTouchActive||hasArticleSelection()||$('sheet').classList.contains('show')||document.activeElement?.matches?.('input,textarea,[contenteditable=true]'))){pendingArticleRender=p;return}
 pendingArticleRender=null;selectionMenuDismissed=false;hideSelectionMenu();releaseArticleImages();renderedArticleId=p.id;renderedArticleContent=p.content;currentArticle=p;renderedHighlights='';pendingHighlights=false;
 $('main').innerHTML=`<a class="article-back" href="#home" onclick="event.preventDefault();backToList()">← 返回</a><h1>${esc(p.title)}</h1><p class="article-meta">${esc(articleDate(p.date))} ${isAdmin()?'<button onclick="editPost()">编辑</button>':''}</p><div class="content" id="ac">${clean(p.content)}</div><div class="article-interactions"><span>喜欢这篇，就点个赞吧！</span><button id="postLikeButton" type="button" onclick="togglePostLike()" aria-pressed="false" aria-label="点赞这篇文章">${heartIcon(false)}</button></div><p id="postLikeMessage" role="status"></p><section id="commentsRegion"></section><section class="box comment-composer" id="commentComposer"><div id="replyTarget" hidden></div><label class="sr-only" for="nc">发表评论</label><textarea id="nc" maxlength="4000" placeholder="评论整篇…（登录后发表）"></textarea><p id="commentMessage" role="status"></p><button id="commentSubmit" onclick="addC()">发表评论</button><p class="composer-hint">选中正文可划线评论或生成书摘</p></section>`;
 const draft=commentDraft(curId);$('nc').value=draft.text||'';replyToId=draft.parent_id||null;$('nc').oninput=saveCommentDraft;updateComposerTarget();renderComments();updatePostLikeUI();refreshArticleHighlights();setupArticleImages();mountSelectionTools();$('ac').onpointerdown=()=>{articleTouchActive=true};$('ac').onpointerup=$('ac').onpointercancel=()=>{articleTouchActive=false};authUI();
}
function refreshArticleHighlights(){const root=$('ac');if(!root||view!=='article')return;const signature=JSON.stringify(highlights.map(h=>[h.id,h.selected_text,h.start_offset]));if(signature===renderedHighlights)return;if(articleTouchActive||hasArticleSelection()||$('sheet').classList.contains('show')){pendingHighlights=true;return}for(const mark of root.querySelectorAll('mark.highlight'))mark.replaceWith(document.createTextNode(mark.textContent));root.normalize();paintHighlights();renderedHighlights=signature;pendingHighlights=false}
function renderComments(){const region=$('commentsRegion');if(!region)return;region.innerHTML=`<h3>评论 · ${comments.length}</h3><p id="discussionMessage" class="composer-hint" role="status"></p>${comments.map((c,i)=>`<div class="comment" id="comment-${c.id}"><div class="floor">${i+1}楼 · ${esc(new Date(c.created_at).toLocaleString('zh-CN'))}</div><b>${esc(name(c.user_id))}</b>${renderReplyQuote(c)}<div class="text">${esc(c.content)}</div>${reactionButton('comment',c.id)} <button onclick="replyC('${c.id}')">回复</button>${isAdmin()?` <button class="danger-button" onclick="removeEntry('comments','${c.id}')">删除</button>`:''}</div>`).join('')||'<p class="empty-comments">还没有评论</p>'}`}
function commentDraft(id){const newer=read('mb_comment_draft_'+id,null);if(newer)return newer;return {text:read('mb_draft_'+id,''),parent_id:null}}
function saveCommentDraft(){if(view!=='article'||!$('nc')||curId===null)return;store('mb_comment_draft_'+curId,JSON.stringify({text:$('nc').value,parent_id:replyToId}))}
function updateComposerTarget(){const target=$('replyTarget');if(!target)return;target.hidden=!replyToId;if(replyToId){target.innerHTML=renderReplyQuote({parent_id:replyToId})+'<button type="button" class="cancel-reply" onclick="cancelReply()">取消回复</button>';$('nc').placeholder='写下你的回复…'}else{target.replaceChildren();$('nc').placeholder='评论整篇…（登录后发表）'}}
function replyC(id){if(!needAuth())return;const c=comments.find(c=>same(c.id,id));if(!c)return;replyToId=c.id;updateComposerTarget();saveCommentDraft();$('commentComposer').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});$('nc').focus({preventScroll:true})}
function cancelReply(){replyToId=null;updateComposerTarget();saveCommentDraft()}
async function addC(){if(writing||!needAuth())return;const content=$('nc').value.trim();if(!content)return;$('commentMessage').textContent='';const postId=curId,parentId=replyToId,v=version,button=$('commentSubmit');saveCommentDraft();writing=true;button.disabled=true;button.textContent='正在发表…';try{const row=await query(sb.from('comments').insert({post_id:postId,user_id:session.user.id,content,parent_id:parentId}).select().single());store('mb_comment_draft_'+postId,JSON.stringify({text:'',parent_id:null}));store('mb_draft_'+postId,JSON.stringify(''));if(v!==version)return;comments=[...comments,row];if(profile&&!profiles.some(p=>p.id===profile.id))profiles.push(profile);store('mb_v2_comments_'+postId,JSON.stringify(comments));$('nc').value='';replyToId=null;updateComposerTarget();renderComments();notice('已发表');loadPostStats(v,false)}catch(e){if(v===version&&$('commentMessage'))$('commentMessage').textContent='发表未完成：'+e.message+'。草稿已保留。'}finally{writing=false;if(button.isConnected){button.disabled=false;button.textContent='发表评论'}}}
function bootMiaobo(){try{history.scrollRestoration='manual'}catch{}const id=routeId();if(id){routeKey='post:'+id;loadArticle(id,history.state?.articleScroll||0)}else{routeKey='home';applyListRoute()}}

let hlDiscussion=null;
function highlightDraftKey(state){return 'mb_hl_discussion_'+state.postId+'_'+state.start}
function saveHLComposerDraft(){const state=hlDiscussion,input=$('hlDiscussionInput');if(!state||!input)return;store(highlightDraftKey(state),JSON.stringify({text:state.text,comment:input.value,parent_id:state.replyId}))}
function closeHLDiscussion(restoreFocus=true){const state=hlDiscussion;if(!state)return;saveHLComposerDraft();document.removeEventListener('keydown',state.keyHandler);$('highlightDiscussion')?.remove();hlDiscussion=null;$('main').inert=false;if(restoreFocus&&state.previous?.isConnected)state.previous.focus();if(pendingHighlights)refreshArticleHighlights()}
function fitHighlightDiscussion(){const overlay=$('highlightDiscussion'),panel=$('hlDiscussionPanel');if(!overlay||!panel)return;const viewport=window.visualViewport;if(viewport){overlay.style.top=viewport.offsetTop+'px';overlay.style.bottom='auto';overlay.style.height=viewport.height+'px';panel.style.maxHeight=Math.max(180,viewport.height-24)+'px'}}
window.visualViewport?.addEventListener('resize',fitHighlightDiscussion);
window.visualViewport?.addEventListener('scroll',fitHighlightDiscussion);
function hlReplyQuote(h){if(!h.parent_id)return '';const parent=highlights.find(x=>same(x.id,h.parent_id));if(!parent)return '<div class="reply-quote reply-unavailable">回复的原评论已不可用</div>';return `<button type="button" class="reply-quote" onclick="scrollHLComment('${parent.id}')"><span class="reply-source">回复 ${esc(name(parent.user_id))}</span><span class="reply-preview">${esc(parent.comment)}</span></button>`}
function scrollHLComment(id){$('hl-comment-'+id)?.scrollIntoView({block:'nearest',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function renderHLDiscussionList(){const state=hlDiscussion,list=$('hlDiscussionList');if(!state||!list)return;const related=highlights.filter(h=>same(h.post_id,state.postId)&&h.selected_text===state.text),scroll=list.scrollTop;$('hlDiscussionTitle').textContent='划线评论 · '+related.length;list.innerHTML=related.map(h=>`<article class="hl-item" id="hl-comment-${h.id}"><b>${esc(name(h.user_id))}</b>${hlReplyQuote(h)}<p class="hl-body">${esc(h.comment)}</p><div class="hl-actions">${reactionButton('highlight',h.id)}<button type="button" onclick="replyHighlight('${h.id}')">回复</button>${isAdmin()?`<button type="button" class="danger-button" onclick="closeHLDiscussion();removeEntry('highlights','${h.id}')">删除</button>`:''}</div></article>`).join('')||'<p class="composer-hint">还没有评论，写下你的想法吧。</p>';list.scrollTop=scroll}
function updateHLReplyTarget(){const state=hlDiscussion,target=$('hlDiscussionReply');if(!state||!target)return;const parent=highlights.find(h=>same(h.id,state.replyId));if(!parent){state.replyId=null;target.hidden=true;target.replaceChildren();$('hlDiscussionInput').placeholder='直接评论这段文字…';return}target.hidden=false;target.innerHTML=`<div class="reply-source">回复 ${esc(name(parent.user_id))}</div><div class="reply-preview">${esc(parent.comment)}</div><button type="button" class="cancel-reply" onclick="cancelHLReply()">取消回复</button>`;$('hlDiscussionInput').placeholder='写下你的回复…'}
function replyHighlight(id){if(!needAuth()||!hlDiscussion)return;const parent=highlights.find(h=>same(h.id,id)&&same(h.post_id,hlDiscussion.postId)&&h.selected_text===hlDiscussion.text);if(!parent)return;hlDiscussion.replyId=parent.id;updateHLReplyTarget();saveHLComposerDraft();$('hlDiscussionInput').focus({preventScroll:true});fitHighlightDiscussion()}
function cancelHLReply(){if(!hlDiscussion)return;hlDiscussion.replyId=null;updateHLReplyTarget();saveHLComposerDraft()}
function showHLComments(text){
 closeHLDiscussion(false);const related=highlights.filter(h=>same(h.post_id,curId)&&h.selected_text===text),anchor=related.find(h=>Number.isInteger(h.start_offset)),start=anchor?.start_offset??Math.max(0,$('ac')?.textContent.indexOf(text)??0);
 const state={postId:curId,text,start,replyId:null,sending:false,previous:document.activeElement};hlDiscussion=state;
 const overlay=document.createElement('div');overlay.id='highlightDiscussion';overlay.className='modal-overlay hl-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','划线评论');
 overlay.innerHTML=`<section class="hl-panel hl-discussion-panel" id="hlDiscussionPanel"><div class="hl-heading"><h3 id="hlDiscussionTitle">划线评论</h3><button type="button" class="hl-dismiss" aria-label="关闭评论" onclick="closeHLDiscussion()">×</button></div><blockquote class="hl-quote" id="hlDiscussionQuote"></blockquote><div class="hl-list" id="hlDiscussionList"></div><form class="hl-composer" onsubmit="event.preventDefault();sendHLDiscussion()"><div class="hl-composer-reply" id="hlDiscussionReply" hidden></div><label class="sr-only" for="hlDiscussionInput">评论这段文字</label><textarea id="hlDiscussionInput" maxlength="4000" placeholder="直接评论这段文字…"></textarea><p id="hlDiscussionMessage" role="status"></p><div class="hl-composer-footer"><span>评论会保留在这段划线下</span><button id="hlDiscussionSubmit" type="submit">发表评论</button></div></form></section>`;
 overlay.onclick=e=>{if(e.target===overlay)closeHLDiscussion()};state.keyHandler=e=>{if(e.key==='Escape'){e.stopImmediatePropagation();closeHLDiscussion()}if(e.key==='Tab'){const nodes=[...overlay.querySelectorAll('button,textarea')].filter(n=>!n.disabled&&!n.closest('[hidden]'));const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};document.addEventListener('keydown',state.keyHandler);document.body.append(overlay);$('main').inert=true;$('hlDiscussionQuote').textContent=text;
 const draft=read(highlightDraftKey(state),null);if(draft?.text===text){$('hlDiscussionInput').value=draft.comment||'';state.replyId=draft.parent_id||null}$('hlDiscussionInput').oninput=saveHLComposerDraft;updateHLReplyTarget();renderHLDiscussionList();fitHighlightDiscussion();overlay.querySelector('.hl-dismiss').focus();
}
async function sendHLDiscussion(){
 const state=hlDiscussion;if(!state||state.sending||!needAuth())return;const comment=$('hlDiscussionInput').value.trim();if(!comment)return $('hlDiscussionMessage').textContent='请先填写你的评论';const uid=session.user.id,parent=state.replyId?highlights.find(h=>same(h.id,state.replyId)):null;
 const payload={post_id:state.postId,user_id:uid,selected_text:state.text,comment,start_offset:parent?.start_offset??state.start};if(state.replyId)payload.parent_id=state.replyId;
 saveHLComposerDraft();state.sending=true;const button=$('hlDiscussionSubmit');button.disabled=true;button.textContent='正在发表…';$('hlDiscussionMessage').textContent='';
 try{const row=await query(sb.from('highlights').insert(payload).select().single());store(highlightDraftKey(state),JSON.stringify({text:state.text,comment:'',parent_id:null}));if(same(curId,state.postId)){highlights=[...highlights,row];if(profile&&!profiles.some(p=>p.id===profile.id))profiles.push(profile);store('mb_v2_highlights_'+state.postId,JSON.stringify(highlights));pendingHighlights=true;loadPostStats(version,false)}if(hlDiscussion===state){$('hlDiscussionInput').value='';state.replyId=null;updateHLReplyTarget();renderHLDiscussionList();$('hlDiscussionMessage').textContent='已发表';scrollHLComment(row.id)}}catch(e){if(hlDiscussion===state)$('hlDiscussionMessage').textContent='发表未完成：'+((e.code==='PGRST204'||e.code==='42703')&&/parent_id/.test(e.message||'')?'回复配置尚未同步，请刷新页面后重试。':e.message)+'。草稿已保留。'}finally{state.sending=false;if(hlDiscussion===state){button.disabled=false;button.textContent='发表评论'}}
}

bootMiaobo();if(sb){refreshAuth().then(()=>{if(curId&&view==='article')showArticle(curId)}).catch(e=>notice('登录状态读取失败：'+e.message));sb.auth.onAuthStateChange(()=>{setTimeout(()=>refreshAuth().catch(()=>{}),0)})}

</script>
